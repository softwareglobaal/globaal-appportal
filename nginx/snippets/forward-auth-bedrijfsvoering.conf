# Appspecifieke variant van forward-auth.conf. De extra proxykop moet in de
# location staan: serverkoppen worden door diens proxy_set_header niet geerfd.
proxy_buffers 8 16k;
proxy_buffer_size 32k;
resolver 127.0.0.11 valid=30s;

location / {
    auth_request /outpost.goauthentik.io/auth/nginx;
    error_page 401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $auth_cookie;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_request_set $authentik_username $upstream_http_x_authentik_username;
    auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
    auth_request_set $authentik_email $upstream_http_x_authentik_email;
    auth_request_set $authentik_name $upstream_http_x_authentik_name;
    auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
    proxy_set_header X-authentik-username $authentik_username;
    proxy_set_header X-authentik-groups $authentik_groups;
    proxy_set_header X-authentik-email $authentik_email;
    proxy_set_header X-authentik-name $authentik_name;
    proxy_set_header X-authentik-uid $authentik_uid;
    proxy_set_header X-Bedrijfsvoering-Proxy-Secret $bedrijfsvoering_proxy_geheim;

    # Een bezoeker mag geen identiteit uit de voormalige Sites-omgeving meesturen.
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass $app_upstream;
}

location /outpost.goauthentik.io {
    set $outpost_backend http://authentik-server:9000;
    proxy_pass $outpost_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Proto https;
    add_header Set-Cookie $auth_cookie;
    add_header Strict-Transport-Security "max-age=31536000" always;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 302 /outpost.goauthentik.io/start?rd=$sso_terug;
}
