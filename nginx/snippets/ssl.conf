# TLS settings shared by all server blocks.
# To switch to Let's Encrypt later: replace certs/fullchain.pem and
# certs/privkey.pem with certbot's output (same filenames) and reload nginx.
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_session_cache   shared:SSL:1m;

# HSTS: de browser onthoudt dat dit adres alleen over https mag. Zonder dit kan
# iemand op hetzelfde netwerk de eerste aanvraag (die nog http is) afvangen; de
# 301 naar https komt dan te laat.
#
# Bewust zonder includeSubDomains en zonder preload. Beide zijn maanden lang niet
# terug te draaien omdat browsers ze onthouden, en includeSubDomains zou ook
# gelden voor subdomeinen die niet via deze nginx lopen.
# "always" is nodig, anders ontbreekt de kopregel op foutpagina's.
add_header Strict-Transport-Security "max-age=31536000" always;
