# Overgenomen van het image nginx:1.27-alpine, met drie toevoegingen die
# hieronder gemarkeerd staan. Reden dat dit bestand in git staat en niet meer
# uit het image komt: `load_module` moet in de hoofdcontext staan, en daar
# komen we niet bij via /etc/nginx/conf.d of /etc/nginx/templates.
#
# Bij een nieuwe nginx-versie: vergelijk dit bestand met dat van het image
# (`docker run --rm nginx:<versie> cat /etc/nginx/nginx.conf`) en neem
# wijzigingen over. Het is bewust een kopie met drie regels, geen herschrijving.

# TOEVOEGING 1: de JavaScript-module. Zit al in het image
# (/usr/lib/nginx/modules/ngx_http_js_module.so), hij werd alleen niet geladen.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # TOEVOEGING 2 en 3: $sso_terug is het terugkeeradres voor de forward-auth,
    # met de tekens gecodeerd die de query zouden breken. Zie nginx/njs/sso.js
    # en het gebruik in nginx/snippets/forward-auth.conf.
    js_import sso from /etc/nginx/njs/sso.js;
    js_set $sso_terug sso.terug;

    include /etc/nginx/conf.d/*.conf;
}
