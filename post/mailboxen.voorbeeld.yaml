# Postbus - de enige plek waar mailboxen en hun toegang staan.
#
# Dit is het VOORBEELD (staat in git, zonder wachtwoorden). Het echte bestand
# staat op de VM in ~/post-config/mailboxen.yaml en komt nooit in git.
#
#   nano ~/post-config/mailboxen.yaml
#
# Na opslaan is de wijziging binnen vijf seconden actief; herstarten hoeft niet.
# Klopt er iets niet, dan staat dat op https://post.globaal.be onder Beheer.

# Waarden die voor elke mailbox gelden, tenzij de mailbox zelf iets anders zegt.
standaard:
  imap_host: imap.one.com
  imap_poort: 993
  # Alleen nodig bij mailboxen die mogen doorsturen; zonder verzendserver
  # vervalt dat recht (de mailbox blijft dan gewoon leesbaar).
  smtp_host: send.one.com
  smtp_poort: 465
  # Welke mappen leesbaar zijn. Laat de lijst weg om alle mappen open te zetten.
  # Let op de punt in de mapnamen van one.com: INBOX.Sent, niet INBOX/Sent.
  mappen: [INBOX, INBOX.Sent]

mailboxen:
  - adres: info@elevaitnv.com
    naam: Elevait info
    # gebruiker: alleen nodig als de IMAP-gebruikersnaam afwijkt van het adres.
    gebruiker: info@elevaitnv.com
    wachtwoord: CHANGE_ME
    # Wie mag lezen: Authentik-groepen. Dit is de hele toegangsregel.
    groepen: [admin]
    # Losse Authentik-gebruikers, voor een uitzondering zonder eigen groep.
    personen: []
    # Mag er ook iets gewijzigd worden in deze mailbox: markeren, verplaatsen,
    # mappen aanmaken en concepten klaarzetten. Zonder deze regel is de
    # mailbox alleen-lezen.
    schrijven: ja
    # Twee ingrijpender rechten, allebei standaard uit en per mailbox:
    #   verwijderen: ja  -> een bericht naar de prullenbak (terugzetbaar).
    #   verzenden: ja    -> een zelf opgesteld bericht echt versturen naar een
    #                       vrij adres (vraagt smtp_host). Dit is de zwaarste
    #                       bevoegdheid; zet hem alleen waar het echt moet.
    # Beide hebben daarnaast een server-noodrem (POSTBUS_VERWIJDEREN /
    # POSTBUS_VERZENDEN in de stack-.env). Staat die uit, dan gebeurt het niet,
    # ook niet als het hier aanstaat.
    # verwijderen: ja
    # verzenden: ja

  - adres: boekhouding@h-architects.be
    naam: Boekhouding H-Architects
    wachtwoord: CHANGE_ME
    groepen: [admin, finance]
    # Deze mailbox mag alleen in de INBOX gelezen worden.
    mappen: [INBOX]

  - adres: mch@h-architects.be
    naam: MCH H-Architects
    wachtwoord: CHANGE_ME
    # Een losse gebruiker in plaats van een groep: dit is een persoonlijke
    # mailbox, daar hoort geen hele afdeling in te kunnen kijken.
    personen: [mehdi]
    schrijven: ja
    # Waar deze mailbox naartoe mag doorsturen. Dit is de hele bevoegdheid:
    # elk adres apart, geen jokertekens, geen "heel het domein". Wat hier niet
    # staat wordt geweigerd. Laat de regel weg en er gaat niets naar buiten.
    #
    # Doorsturen stuurt een bericht dat AL in de mailbox staat, met het
    # origineel als bijlage. Een zelf opgesteld bericht versturen kan niet.
    # Let op: de server heeft daarnaast een noodrem (POSTBUS_DOORSTUREN in de
    # stack-.env). Staat die uit, dan gaat er niets uit, ook niet hier.
    doorsturen: [ap@unabo.be]

# Een mailbox zonder groepen en zonder personen is voor niemand zichtbaar.
# Dat is met opzet: toegang staat dicht tot ze expliciet wordt opengezet.
# Hetzelfde geldt voor doorsturen: geen lijst betekent niets doorsturen.
