<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Besturingscentrum{% endblock %} · Agents</title>
<style>
  :root {
    --bg:#f5f6f7; --paneel:#ffffff; --lijn:#e4e7ea; --lijn-sterk:#d5dade;
    --tekst:#1e2830; --tekst-2:#5c6771; --tekst-3:#8d959d; --accent:#2f4a63;
    --rust:#98a0a8; --actief:#2f7d5a; --klaar:#3663a0; --fout:#a63d3d;
    --ja:#2f7d5a; --nee:#a63d3d; --amber:#916312;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tekst);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 22px 60px;}
  a{color:var(--accent);text-decoration:none;} a:hover{text-decoration:underline;}

  .nav{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--lijn);margin-bottom:22px;}
  .nav a{padding:9px 13px;font-size:13px;color:var(--tekst-2);border-bottom:2px solid transparent;}
  .nav a:hover{color:var(--tekst);text-decoration:none;}
  .nav a.actief{color:var(--tekst);border-bottom-color:var(--accent);font-weight:600;}
  .badge-n{background:var(--amber);color:#fff;border-radius:999px;font-size:10.5px;font-weight:600;padding:1px 6px;margin-left:3px;}

  .kop{margin-bottom:16px;}
  .kop h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em;}
  .kop .sub{color:var(--tekst-2);font-size:12.5px;margin-top:2px;}

  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--tekst-2);margin:24px 0 8px;}
  .paneel{background:var(--paneel);border:1px solid var(--lijn);border-radius:6px;overflow:hidden;}
  .leeg{color:var(--tekst-3);font-size:13px;padding:16px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
  .chip{border:1px solid var(--lijn-sterk);background:var(--paneel);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--tekst-2);}
  .chip b{color:var(--tekst);font-variant-numeric:tabular-nums;}
  .chip.actief{border-color:var(--accent);color:var(--tekst);background:#eef2f6;}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px;}
  .filters input,.filters select{border:1px solid var(--lijn-sterk);background:var(--paneel);border-radius:5px;padding:6px 10px;font-size:12.5px;color:var(--tekst);}
  .filters input{min-width:190px;}

  .agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;}
  .agent-kaart{background:var(--paneel);border:1px solid var(--lijn);border-radius:6px;padding:14px 15px;}
  .k-top{display:flex;align-items:center;gap:10px;}
  .avatar{display:inline-flex;width:34px;height:34px;border-radius:6px;background:#eceef0;color:#58626b;font-size:12px;font-weight:600;align-items:center;justify-content:center;flex:0 0 34px;}
  .k-id{min-width:0;} .k-naam{font-weight:600;font-size:13.5px;}
  .k-naam .nick{font-weight:400;color:var(--tekst-3);font-style:italic;font-size:12px;}
  .k-rol{color:var(--tekst-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-status{display:flex;align-items:center;margin-top:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--rust);margin-right:7px;}
  .agent-kaart[data-groep="bezig"] .dot{background:var(--actief);}
  .agent-kaart[data-groep="klaar"] .dot{background:var(--klaar);}
  .agent-kaart[data-groep="fout"] .dot{background:var(--fout);}
  .agent-kaart[data-groep="stil"] .dot{background:var(--amber);}
  .s-txt{font-size:12.5px;color:var(--tekst-2);text-transform:capitalize;}
  .team-tag{margin-left:auto;font-size:10.5px;color:var(--tekst-3);border:1px solid var(--lijn);border-radius:999px;padding:1px 7px;}
  .k-act{margin-top:6px;font-size:12px;color:var(--tekst-2);min-height:16px;}

  table.lijst{width:100%;border-collapse:collapse;}
  table.lijst th,table.lijst td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--lijn);font-size:13px;vertical-align:top;}
  table.lijst thead th{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--tekst-3);font-weight:600;}
  table.lijst tbody tr:last-child td{border-bottom:0;}
  .code{font-family:var(--mono);font-size:12px;color:var(--tekst-2);}

  .sb{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .sb.in_review{background:#f6ecd6;color:var(--amber);}
  .sb.wijziging_gevraagd{background:#f6ecd6;color:var(--amber);}
  .sb.goedgekeurd{background:#e0efe6;color:var(--ja);}
  .sb.afgewezen{background:#f3e0e0;color:var(--nee);}
  .sb.gepubliceerd{background:#e2ebf5;color:var(--klaar);}

  .prose{background:var(--paneel);border:1px solid var(--lijn);border-radius:8px;padding:22px 26px;font-size:14px;line-height:1.65;}
  .prose h1{font-size:20px;margin:18px 0 8px;} .prose h1:first-child{margin-top:0;}
  .prose h2{font-size:16px;text-transform:none;letter-spacing:0;color:var(--tekst);margin:22px 0 6px;}
  .prose h3{font-size:14px;margin:16px 0 4px;}
  .prose p{margin:0 0 10px;} .prose ul,.prose ol{margin:0 0 10px;padding-left:22px;} .prose li{margin:3px 0;}
  .prose table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:13px;display:block;overflow-x:auto;}
  .prose th,.prose td{border:1px solid var(--lijn);padding:6px 10px;text-align:left;}
  .prose th{background:#f4f6f8;}
  .prose code{font-family:var(--mono);font-size:12.5px;background:#f2f4f6;padding:1px 4px;border-radius:3px;}
  .prose pre{background:#f4f5f6;border:1px solid var(--lijn);border-radius:6px;padding:10px 12px;overflow-x:auto;}
  .prose blockquote{border-left:3px solid var(--lijn-sterk);margin:8px 0;padding:2px 14px;color:var(--tekst-2);}

  .meta-rij{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--tekst-2);font-size:12.5px;margin:4px 0 14px;}
  .acties{background:var(--paneel);border:1px solid var(--lijn);border-radius:8px;padding:16px 18px;margin-top:16px;}
  .acties textarea{width:100%;border:1px solid var(--lijn-sterk);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:56px;}
  .acties-knoppen{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .knop{border:1px solid var(--lijn-sterk);background:var(--paneel);color:var(--tekst);border-radius:5px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;}
  .knop:hover{background:#f2f4f5;}
  .knop.ja{border-color:var(--ja);color:var(--ja);} .knop.nee:hover{border-color:var(--nee);color:var(--nee);}
  .knop.pub:hover{border-color:var(--klaar);color:var(--klaar);}

  footer{margin-top:34px;color:var(--tekst-3);font-size:12px;border-top:1px solid var(--lijn);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  {% set p = request.path %}
  <nav class="nav">
    <a href="/overzicht" class="{{ 'actief' if p=='/overzicht' else '' }}">Overzicht</a>
    <a href="/validatie" class="{{ 'actief' if p=='/validatie' else '' }}">Validatie{% if nav_te_valideren %} <span class="badge-n">{{ nav_te_valideren }}</span>{% endif %}</a>
    <a href="/opleveringen" class="{{ 'actief' if p.startswith('/opleveringen') or p.startswith('/oplevering/') else '' }}">Opleveringen</a>
    <a href="/seo-team">Organogram</a>
    <a href="/">Besturingscentrum</a>
  </nav>
  {% block body %}{% endblock %}
  <footer>Aangemeld als {{ nav_user }}. Terug naar het <a href="{{ portal_url }}">portaal</a>.</footer>
</div>
</body>
</html>
