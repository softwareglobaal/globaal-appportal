<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titel %}Vindplaats{% endblock %}</title>
<style>
  :root{--bg:#f3f4f6;--vlak:#ffffff;--rand:#e2e4e8;--inkt:#1b1d21;
    --stil:#6b7280;--accent:#047857;--accentz:#ecfdf3;
    --wacht:#b45309;--wachtz:#fef3e2;
    --ui:-apple-system,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--inkt);
    font:14px/1.55 var(--ui);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent)}
  .top{display:flex;align-items:center;gap:12px;background:var(--vlak);
    border-bottom:1px solid var(--rand);padding:0 16px;height:52px;flex:none}
  .top .logo{font-weight:700;font-size:15px;letter-spacing:-.01em;
    color:var(--inkt);text-decoration:none}
  .top .logo em{color:var(--accent);font-style:normal}
  .env{font:600 11px var(--ui);color:var(--wacht);background:var(--wachtz);
    border:1px solid #f2dfc0;border-radius:4px;padding:2px 8px}
  .top .rek{flex:1}
  .top .rechts{font-size:13px;color:var(--stil)}
  .top .rechts a{color:var(--stil);text-decoration:none;margin-left:16px}
  .top .rechts a:hover{color:var(--inkt)}
  main{flex:1;width:100%;max-width:52rem;margin:0 auto;padding:22px 18px 70px}
  .docbalk{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .docbalk .docnaam{font-weight:600;font-size:15px}
  .docbalk .docmeta{font:12px var(--mono);color:var(--stil)}
  .paneel{background:var(--vlak);border:1px solid var(--rand);
    border-radius:8px;padding:16px}
  form.zoek{display:flex;gap:8px}
  input[type=search]{flex:1;border:1px solid var(--rand);border-radius:6px;
    padding:10px 13px;font:15px var(--ui);color:var(--inkt);outline:none;
    background:#fbfbfc}
  input[type=search]:focus{border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px var(--accentz)}
  button.zoekknop{background:var(--accent);color:#fff;border:0;
    border-radius:6px;padding:10px 20px;font:600 14px var(--ui);cursor:pointer}
  button.zoekknop:hover{background:#065f46}
  .proberen{font-size:12.5px;color:var(--stil);margin:10px 2px 0}
  .proberen a{text-decoration:none;background:#eef0f2;color:#374151;
    border-radius:4px;padding:2px 8px;margin-right:6px;display:inline-block;
    margin-top:4px}
  .proberen a:hover{background:var(--accentz);color:var(--accent)}
  h2.kop{font-size:14px;color:var(--stil);font-weight:600;margin:22px 2px 10px}
  .stuk{background:var(--vlak);border:1px solid var(--rand);border-radius:8px;
    padding:13px 16px;margin-bottom:10px}
  .stuk .r1{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;
    flex-wrap:wrap}
  .chip{font:600 11.5px var(--ui);border-radius:4px;padding:2px 7px;
    background:var(--accentz);color:var(--accent)}
  .chip.grijs{background:#eef0f2;color:#374151;font-weight:500}
  .stuk .waar{font-size:12px;color:var(--stil);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stuk .tekst{white-space:pre-wrap;margin:0;font-size:13.5px;color:#2a2d31}
  .stuk .verder{margin:8px 0 0;font-size:12.5px}
  .stuk .verder a{text-decoration:none;font-weight:600}
  .uitlegtje{font-size:13px;color:var(--stil);margin:14px 2px 0;max-width:44rem}
  .voet{border-top:1px solid var(--rand);background:var(--vlak);
    padding:14px 18px;font-size:12px;color:var(--stil);flex:none}
  .voet .in{max-width:52rem;margin:0 auto}
  @media(max-width:560px){form.zoek{flex-direction:column}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="{{ url_for('start') }}">vind<em>plaats</em></a>
  <span class="env">demo</span>
  <span class="rek"></span>
  <span class="rechts">
    <a href="https://elevaitnv.com/projecten">projecten</a>
    <a href="https://elevaitnv.com/#contact">contact</a>
  </span>
</header>
<main>
{% block lijf %}{% endblock %}
</main>
<div class="voet"><div class="in">
  Demo van Elevait NV. U levert hier niets aan en er wordt van u niets
  bewaard. Uw eigen documenten werken net zo:
  <a href="https://elevaitnv.com/#contact">vertel ons wat u hebt liggen</a>.
</div></div>
</body>
</html>
