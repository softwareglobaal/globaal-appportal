# Application catalog. Echte applicaties; toegang via één groep per app.
#
# roles         de groepen die de app mogen openen. Dit wordt in Authentik een
#               policy binding; wie hier niet in staat, komt er niet in.
# extra_groepen groepen die wel moeten bestaan maar GEEN toegang geven. Bedoeld
#               voor rechten die de app zelf aftoetst, zoals vermogen-editors.
# host          alleen nodig als de app niet op <subdomain>.globaal.be draait.
# poort         alleen nodig om nginx en compose te genereren voor een nieuwe app.
#
# scripts/app-registreren.py zet dit om naar Authentik.
# scripts/vergelijk-authentik.py laat zien of dat klopt met wat er nu staat.
apps:
  - id: omv
    name: OMV Pipeline
    description: Omgevingsloket scrape, PDF-merge en AI-extractie
    subdomain: omv
    roles: [admin, manager]
    status: active
  - id: schuldentracker
    name: Schuldentracker
    description: Schuldbeheer en dossiers (finance)
    subdomain: schuldentracker
    roles: [schuldentracker]
    status: active
  - id: chaos
    name: Chaos Taskforce
    description: Planning en openstaande facturen (UNABO)
    subdomain: chaos
    roles: [chaos]
    status: active
  - id: agenda
    name: Beschikbaarheid Mehdi
    description: Agenda en beschikbaarheid van Mehdi
    subdomain: agenda
    roles: [agenda-bekijken]
    extra_groepen: [agenda-volledig, agenda-architect]
    status: active
  - id: telefoonregister
    name: Telefoonregister
    description: Centraal telefoonregister (single source of truth)
    subdomain: telefoonregister
    roles: [telefoonregister]
    status: active
  - id: facturatie
    name: Uitgaande Facturatie
    description: Octopus-facturen, betalingen en schijven (H-Architects)
    subdomain: facturatie
    roles: [facturatie]
    status: active
  - id: barstenscheuren
    name: Barsten & Scheuren
    description: Stabiliteitsverslagen — barsten en scheuren
    subdomain: barstenscheuren
    roles: [admin, manager, barstenscheuren]
    status: active
  - id: barstenscheurenv2
    name: Barsten & Scheuren v2
    description: Dossiers verwerken, checklist met bewijsstatus, meetstand kennisbank
    subdomain: barstenscheurenv2
    roles: [admin, manager, barstenscheuren]
    status: active
  - id: vermogen
    name: Vermogen
    description: Panden, verzekeringen, leningen & leasingen, syndicus
    subdomain: vermogen
    roles: [admin, manager, vermogen]
    extra_groepen: [vermogen-editors]
    status: active
  - id: draaiboek
    name: Draaiboek
    description: Playbook-management — draaiboeken, dossiers en runs
    subdomain: draaiboek
    roles: [admin, manager, draaiboek]
    extra_groepen: [draaiboek-editors]
    status: active
  - id: agents
    name: Agents
    description: Besturingscentrum van het agent-team
    subdomain: agents
    roles: [admin, manager, agents]
    status: active
  - id: items
    name: Items
    description: Verkoop-etalage tweedehands ICT met AI-taxatie
    subdomain: items
    roles: [admin, manager, items]
    status: active
  - id: boekhouding
    name: Boekhouding
    description: Factureren vanuit Monday naar Octopus, en openstaande posten
    subdomain: boekhouding
    roles: [admin, manager, boekhouding]
    status: active
  - id: boekhouding-dashboard
    name: Boekhouding-dashboard
    description: Register van firma's, rekeningen, kaarten, personen, systemen en regels van de boekhouding
    subdomain: boekhouding-dashboard
    roles: [admin, manager, boekhouding]
    status: active
  - id: quickbooks
    name: QuickBooks
    description: Boekhouding HDS via QuickBooks Online
    subdomain: quickbooks
    roles: [admin, manager, boekhouding]
    status: active
  - id: angela
    name: Angela
    description: Werkdashboard initiatief Suriname - merk, webshop, inkoop, NGO
    subdomain: angela
    roles: [admin, manager, angela]
    status: active
  - id: post
    name: Postbus
    description: Leestoegang tot zakelijke mailboxen voor Claude (MCP over IMAP)
    subdomain: post
    roles: [admin, manager, postbus]
    status: active
  - id: werfverslag
    name: Werfverslag
    description: Werfverslagen, to-do-lijsten en checklijsten (H-Architects)
    subdomain: werf
    roles: [admin, manager, werfverslag, contracten]
    status: active
  - id: contracten
    name: Contracten
    description: Contracten H-Architects, dossiercontrole en salesproces
    subdomain: contracten
    roles: [admin, manager, contracten]
    status: active
  # Bewust alleen de rol 'locatie', niet admin of manager: dit is het
  # persoonlijke bewegingslogboek van Mehdi en hoort niet in de tegellijst van
  # collega's te verschijnen. Zelfde keuze als bij de agenda-tegel.
  - id: locatie
    name: Locatielogboek
    description: Waar was ik wanneer - eigen tijdlijn via OwnTracks op de iPhone
    subdomain: locatie
    roles: [locatie]
    status: active
  # Organisatie kosten (werknaam Doorbelasting): wat elke firma van de groep
  # maandelijks aan gedeelde kosten draagt, per land, met bron en redenering per
  # regel. Bevat individuele lonen: ENKEL db-alles (Siyan, Mehdi, Angela), bewust
  # geen admin (beslissing Siyan 02-10-2026). De app toetst dat zelf ook af.
  - id: organisatiekosten
    name: Organisatie kosten
    description: Finance van de groep per firma en per land, met bron en redenering per regel
    subdomain: organisatiekosten
    roles: [db-alles]
    status: active
    poort: 3130
