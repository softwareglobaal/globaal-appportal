<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ datum }} · Locatielogboek</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg:#f5f6f7; --paneel:#ffffff; --lijn:#e4e7ea; --lijn-sterk:#d5dade;
    --tekst:#1e2830; --tekst-2:#5c6771; --tekst-3:#8d959d; --accent:#2f4a63;
    --bezoek:#2f7d5a; --rit:#3663a0; --amber:#916312;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tekst);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 22px 60px;}
  a{color:var(--accent);text-decoration:none;} a:hover{text-decoration:underline;}

  .kop{margin-bottom:16px;}
  .kop h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em;}
  .kop .sub{color:var(--tekst-2);font-size:12.5px;margin-top:2px;}

  .dagen{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;}
  .dagen a{border:1px solid var(--lijn-sterk);background:var(--paneel);border-radius:999px;
    padding:4px 11px;font-size:12.5px;color:var(--tekst-2);}
  .dagen a.actief{border-color:var(--accent);color:var(--tekst);background:#eef2f6;font-weight:600;}

  .cijfers{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px;}
  .cijfer{background:var(--paneel);border:1px solid var(--lijn);border-radius:6px;
    padding:10px 14px;min-width:110px;}
  .cijfer .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;}
  .cijfer .l{font-size:11.5px;color:var(--tekst-3);text-transform:uppercase;letter-spacing:0.04em;}

  #kaart{height:340px;border:1px solid var(--lijn);border-radius:6px;margin-bottom:18px;
    background:var(--paneel);}

  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--tekst-2);margin:24px 0 8px;}
  .paneel{background:var(--paneel);border:1px solid var(--lijn);border-radius:6px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;font-weight:600;color:var(--tekst-3);
    text-transform:uppercase;letter-spacing:0.04em;padding:9px 14px;border-bottom:1px solid var(--lijn);}
  td{padding:9px 14px;border-bottom:1px solid var(--lijn);font-size:13px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr.rij:hover{background:#fafbfc;cursor:pointer;}
  .tijd{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--tekst-2);}
  .merk{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;}
  .merk.bezoek{background:var(--bezoek);} .merk.rit{background:var(--rit);}
  .merk.leeg-merk{background:transparent;border:1px dashed var(--tekst-3);}
  tr.gat td{color:var(--tekst-3);background:#fafafa;font-style:italic;}
  .duur{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .leeg{color:var(--tekst-3);font-size:13px;padding:20px 14px;}
  .plek{font-weight:600;}
  .dossier{display:inline-block;background:#eef2f6;border:1px solid var(--lijn-sterk);
    border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);margin-left:5px;}
  .coord{color:var(--tekst-3);font-size:12px;}
  .wijze{color:var(--tekst-3);font-size:12px;}
  /* Welke tracker dit zag. Sinds 03-10-2026 meet de auto mee, en later komt
     het draagbare toestel erbij; zonder dit label is niet te zien of een gat
     aan het toestel of aan de dag ligt. */
  .bron{display:inline-block;border:1px solid var(--lijn-sterk);border-radius:4px;
    padding:0 5px;font-size:11px;color:var(--tekst-2);margin-left:5px;
    text-transform:uppercase;letter-spacing:0.04em;}
  .bron.auto{border-color:#b9d2c6;background:#eef6f2;color:var(--bezoek);}
  .voet{margin-top:26px;font-size:12px;color:var(--tekst-3);}

  .status{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0 0 16px;}
  .bronkaart{background:var(--paneel);border:1px solid var(--lijn);border-radius:6px;padding:10px 14px;font-size:12.5px;}
  .bronkaart .naam{font-weight:600;font-size:13px;}
  .bronkaart .toestand{display:inline-block;border-radius:4px;padding:0 6px;font-size:11.5px;margin-left:6px;
    background:#eef2f6;color:var(--accent);}
  .bronkaart .toestand.alarm{background:#fbecea;color:#9b2c1f;}
  .bronkaart .toestand.rustig{background:#eef6f2;color:var(--bezoek);}
  .bronkaart .uitleg{color:var(--tekst-2);margin-top:4px;}
  .bronkaart dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:6px 0 0;}
  .bronkaart dt{color:var(--tekst-3);} .bronkaart dd{margin:0;}
  .bronkaart.uit{opacity:.75;}
  .zeker{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;margin-left:5px;border:1px solid var(--lijn-sterk);}
  .zeker.waarschijnlijk,.zeker.bevestigd{background:#eef6f2;border-color:#b9d2c6;color:var(--bezoek);}
  .zeker.onzeker,.zeker.kort{background:#fdf5e6;border-color:#ead6a8;color:var(--amber);}
  .kand{color:var(--tekst-2);font-size:12px;}
  .corr{margin-top:4px;font-size:12px;} .corr select,.corr button{font-size:12px;}
  .klein{font-size:12px;color:var(--tekst-3);}
  .taken td,.taken th{padding:6px 10px;font-size:12px;}
  .ververst{font-size:11.5px;color:var(--tekst-3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="kop">
    <h1>Locatielogboek</h1>
    <div class="sub">Reeks van de tracker in de auto sinds {{ eerste_dag }}. De auto bewijst waar de auto stond, niet waar Mehdi was.</div>
  </div>
  <div id="kaart"></div>
  <div id="inhoud">{% include "_inhoud.html" %}</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var DAG = {{ datum | tojson }}, VANDAAG = {{ vandaag | tojson }};
  var kaart = L.map('kaart');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(kaart);
  var laag = L.layerGroup().addTo(kaart);
  var eersteKeer = true;

  function tekst(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

  function tekenKaart() {
    return fetch('/api/dag/' + DAG, {cache: 'no-store'})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        laag.clearLayers();
        var grenzen = [];
        (d.indeling || []).forEach(function (s) {
          if (s.soort === 'bezoek') {
            var m = L.circleMarker([s.lat, s.lon], {
              radius: 7, color: '#2f7d5a', fillColor: '#2f7d5a', fillOpacity: 0.75, weight: 2
            }).addTo(laag);
            var naam = s.plek ? '<b>' + tekst(s.plek) + '</b>' + (s.dossier ? ' <code>' + tekst(s.dossier) + '</code>' : '') + '<br>' : '';
            m.bindPopup(naam + s.minuten + ' min');
            grenzen.push([s.lat, s.lon]);
          } else if (s.spoor && s.spoor.length > 1) {
            L.polyline(s.spoor, { color: '#3663a0', weight: 3, opacity: 0.8 }).addTo(laag);
            s.spoor.forEach(function (p) { grenzen.push(p); });
          }
        });
        // Alleen de eerste keer passend zoomen: bij het verversen blijft de kaart waar je hem zette.
        // Laadt de pagina in een verborgen tabblad, dan is de kaart 0 breed en zou fitBounds op
        // het maximum zoomen; dan pas passen zodra de kaart zichtbaar is.
        if (eersteKeer) {
          var pas = function () {
            kaart.invalidateSize();
            if (grenzen.length) { kaart.fitBounds(grenzen, { padding: [30, 30] }); }
            else { kaart.setView([50.85, 4.35], 9); }
          };
          if (kaart.getContainer().clientWidth > 0) { pas(); }
          else {
            var wacht = setInterval(function () {
              if (kaart.getContainer().clientWidth > 0) { clearInterval(wacht); pas(); }
            }, 500);
          }
          eersteKeer = false;
        }
      })
      .catch(function () { if (eersteKeer) { kaart.setView([50.85, 4.35], 9); eersteKeer = false; } });
  }

  function koppel() {
    document.querySelectorAll('tr.rij').forEach(function (rij) {
      rij.addEventListener('click', function (e) {
        if (e.target.closest('.corr')) return;
        var lat = parseFloat(rij.dataset.lat), lon = parseFloat(rij.dataset.lon);
        if (!isNaN(lat) && !isNaN(lon)) kaart.setView([lat, lon], 16);
      });
    });
    document.querySelectorAll('form.corr').forEach(function (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var keuze = f.querySelector('select').value;
        if (!keuze) return;
        var d = {bron: f.dataset.bron, van: f.dataset.van, tot: f.dataset.tot};
        if (keuze === 'geen_project' || keuze === 'niet_mehdi') { d.wat = keuze; }
        else { d.wat = 'project'; d.sleutel = keuze; }
        d.reden = 'via het dashboard';
        fetch('/api/correctie', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                 body: JSON.stringify(d), credentials: 'same-origin'})
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function () { ververs(); })
          .catch(function (x) { alert('Correctie niet bewaard (' + x.message + ')'); });
      });
    });
  }

  function ververs() {
    return fetch('/?dag=' + DAG + '&deel=1', {cache: 'no-store'})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        // Niet vervangen terwijl iemand een correctie aan het kiezen is.
        if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.corr')) return;
        document.getElementById('inhoud').innerHTML = html;
        koppel();
        return tekenKaart();
      })
      .catch(function () {
        var v = document.querySelector('.ververst');
        if (v) v.textContent = 'verversen mislukt, volgende poging over 45 s';
      });
  }

  koppel();
  tekenKaart();
  // Vandaag ververst zichzelf: kaart, tabel, cijfers en bronstatus, elke 45 seconden.
  if (DAG === VANDAAG) { setInterval(ververs, 45000); }
})();
</script>
</body>
</html>
