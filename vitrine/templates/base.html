<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Kennisbank uit een gescand boek{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --inkt:#101418; --zacht:#5a6472; --lijn:#e4e0d8; --vlak:#f6f3ed;
    --papier:#fbf9f5; --wit:#fff;
    --accent:#1a4bd6; --accent-diep:#12369c; --accent-licht:#e8eeff;
    --oker:#c8621f; --oker-licht:#fdf0e6;
    --donker:#11151c; --donker-zacht:#1b2029; --donker-tekst:#a8b1c0;
    --goed:#137a4b; --waarschuwing:#8a5d00; --fout:#b3261e;
    --schrift:'Inter',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 var(--schrift);color:var(--inkt);
       background:var(--papier);-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  header{background:var(--wit);border-bottom:1px solid var(--lijn);
         position:sticky;top:0;z-index:20}
  header .in{max-width:900px;margin:0 auto;padding:14px 24px;display:flex;
             align-items:center;gap:16px}
  header h1{font-size:18px;margin:0;letter-spacing:-.02em;font-weight:600}
  header h1 a{color:var(--inkt);text-decoration:none}
  header nav{margin-left:auto;display:flex;gap:20px;font-size:14px}
  header nav a{color:var(--zacht);text-decoration:none;font-weight:500}
  header nav a:hover,header nav a.aan{color:var(--inkt)}
  main{max-width:900px;margin:0 auto;padding:34px 24px 80px}
  h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;
     letter-spacing:-.015em;margin:0 0 12px}
  h3{font-size:17px;margin:34px 0 12px;font-weight:650;letter-spacing:-.01em}
  h4{font-size:15px;margin:0 0 7px;font-weight:650}
  p.lead{color:var(--zacht);font-size:17px;margin:0 0 26px;line-height:1.6}
  .oogmerk{font-size:12px;font-weight:600;letter-spacing:.14em;
           text-transform:uppercase;color:var(--oker);margin:0 0 12px}
  .kaart{background:var(--wit);border:1px solid var(--lijn);border-radius:13px;
         padding:22px 24px;margin-bottom:16px}
  .meting{display:flex;gap:30px;flex-wrap:wrap;margin:0}
  .meting div{min-width:118px}
  .meting .getal{font-family:var(--display);font-weight:400;font-size:38px;
                 letter-spacing:-.02em;display:block;line-height:1}
  .meting .naam{color:var(--zacht);font-size:12px;text-transform:uppercase;
                letter-spacing:.05em;margin-top:6px}
  .goed{color:var(--goed)} .waarschuwing{color:var(--waarschuwing)}
  .balk{height:6px;background:var(--lijn);border-radius:3px;overflow:hidden;
        margin-top:8px;max-width:150px}
  .balk i{display:block;height:100%;background:var(--goed);border-radius:3px}
  .stil{color:var(--zacht)} .klein{font-size:13px}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
  input[type=search]{width:100%;padding:14px 16px;font-size:16px;
       border:1px solid var(--lijn);border-radius:11px;background:var(--wit);
       font-family:inherit}
  .knop{display:inline-block;background:var(--accent);color:#fff;border:0;
        padding:10px 17px;border-radius:9px;font-size:14px;font-weight:600;
        cursor:pointer;text-decoration:none;font-family:inherit}
  .knop.grijs{background:var(--wit);color:var(--inkt);border:1px solid var(--lijn)}
  .merk{display:inline-block;background:var(--vlak);border:1px solid var(--lijn);
        border-radius:20px;padding:2px 10px;font-size:12px;color:var(--zacht);
        margin-right:5px}
  .merk.blauw{background:var(--accent-licht);border-color:#c9d6fb;
              color:var(--accent);font-weight:600}
  .merk.oker{background:var(--oker-licht);border-color:#f2d4b8;color:var(--oker);
             font-weight:600}
  .fragment{white-space:pre-wrap;background:var(--vlak);border:1px solid var(--lijn);
            border-radius:10px;padding:14px 16px;font-size:14px;margin-top:10px;
            line-height:1.6}
  .vlaggen a{font-size:13px;margin-right:6px;display:inline-block;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--lijn);
        vertical-align:top}
  th{font-weight:600;color:var(--zacht);font-size:11.5px;text-transform:uppercase;
     letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  /* proces */
  .stap{display:flex;gap:18px;padding-bottom:28px;position:relative}
  .stap:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;
    bottom:2px;width:1px;background:var(--lijn)}
  .stap .nr{flex:0 0 35px;height:35px;border-radius:50%;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;z-index:1}
  .stap .lijf{flex:1}
  .stap h4{margin:6px 0 6px;font-size:16px}
  .stap p{margin:0 0 8px;color:var(--zacht);line-height:1.65}
  .stap .cijfer{display:inline-block;background:var(--vlak);
    border:1px solid var(--lijn);border-radius:7px;padding:2px 9px;
    font-size:13px;font-weight:600;color:var(--inkt);margin:2px 4px 2px 0}
  .deterministisch{color:var(--goed)} .model{color:var(--accent)}
  .voet{border-top:1px solid var(--lijn);margin-top:44px;padding-top:20px;
        color:var(--zacht);font-size:13px}
  @media(max-width:640px){ h2{font-size:30px} }
</style>
</head>
<body>
<header><div class="in">
  <h1><a href="/">Kennisbank</a></h1>
  <nav>
    <a href="/" class="{{ 'aan' if actief == 'zoek' }}">Zoeken</a>
    <a href="/proces" class="{{ 'aan' if actief == 'proces' }}">Hoe dit tot stand kwam</a>
  </nav>
</div></header>
<main>{% block inhoud %}{% endblock %}</main>
</body>
</html>
