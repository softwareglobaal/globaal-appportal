<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Dagboek{% endblock %}</title>
<style>
  :root{--bg:#0f1115;--paper:#171a21;--rand:#262b35;--tekst:#eef0f4;--zacht:#9aa3b2;--accent:#6ea8fe;
        --groen:#34c37a;--oranje:#f5a524;--rood:#ef5b5b;--grijs:#59606d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 20px;border-bottom:1px solid var(--rand);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  header h1{margin:0;font-size:22px}
  header a{color:var(--accent);text-decoration:none}
  main{padding:16px;max-width:1100px;margin:0 auto}
  .zacht{color:var(--zacht)}
  .klein{font-size:13px}
  .kaart{display:block;background:var(--paper);border:1px solid var(--rand);border-radius:14px;padding:14px 16px;margin-bottom:12px;color:inherit;text-decoration:none}
  a.kaart:hover{border-color:var(--accent)}
  .kaart h2{margin:0 0 10px;font-size:18px}
  .tegels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .tegel{background:#1d212a;border-radius:10px;padding:8px 10px;min-width:0}
  .tegel .naam{font-size:12px;color:var(--zacht);text-transform:uppercase;letter-spacing:.06em}
  .tegel .groot{font-size:26px;font-weight:700;line-height:1.2}
  .tegel .klein{color:var(--zacht);overflow-wrap:anywhere}
  .tegel.uit .groot{color:var(--grijs)}
  .stippen{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
  .stip{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .groen{background:var(--groen)}.oranje{background:var(--oranje)}.rood{background:var(--rood)}.grijs{background:var(--grijs)}
  .leeg{color:var(--zacht);font-style:italic}
  @media (max-width:820px){.tegels{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:480px){.tegels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
{% block inhoud %}{% endblock %}
</body>
</html>
