services:
  # De appportal-Postgres op loopback voor host-services (kosten-dashboard):
  # gedocumenteerd contract in globaal-kosten/deploy/appportal. Stond eerder
  # alleen als handmatige wijziging op de VM en verdween daardoor bij het
  # incident-herstel van 2026-07-14; vanaf nu in git (de omv-v2-les).
  # 5432 op de host is bezet door de losse native Postgres, daarom 5433.
  postgresql:
    ports:
      - "127.0.0.1:5433:5432"

  # Kosten-dashboard, herbouw als stack-app (besluit Shaniel 2026-07-15):
  # leest alles uit de database (kosten.bank_transactie + Octopus-spiegel);
  # de PDF-pijplijn blijft als host-service draaien en is via hostmachine
  # bereikbaar voor de ververs-knop. Checkout: ~/appportal/kosten.
  app-kosten:
    build:
      context: ./kosten
      dockerfile: app/Dockerfile
    image: appportal-kosten
    restart: unless-stopped
    environment:
      PORT: "3012"
      KOSTEN_DB_URL: ${KOSTEN_STACK_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      VERVERS_URL: ${KOSTEN_VERVERS_URL:-http://hostmachine:8090/ververs}
    extra_hosts:
      - "hostmachine:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3012/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  app-hr:
    build:
      context: ./hr
      dockerfile: app/Dockerfile
    image: appportal-hr
    restart: unless-stopped
    environment:
      PORT: "3013"
      # Eigen rol (migratie 075); leeg = app toont een nette melding.
      HR_DB_URL: ${HR_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      # Zelfde sleutel als de DeskTime-spiegel van de organisatie-app.
      DESKTIME_API_KEY: ${DESKTIME_API_KEY:-}
      HR_GROUPS: ${HR_GROUPS:-hr,manager}
      HR_VANAF: ${HR_VANAF:-2025-01-01}
      HR_HANDMATIG_VANAF: ${HR_HANDMATIG_VANAF:-2026-01-01}
      # Verlofdashboard (/verlof): leest een Google-agenda in een richting.
      # De sleutel is een servicegebruiker en staat op het hr-data-volume, niet
      # in git. Zonder deze drie draait de app gewoon door, alleen zonder sync.
      GOOGLE_CALENDAR_KEY: ${GOOGLE_CALENDAR_KEY:-}
      VERLOF_KALENDERS: ${VERLOF_KALENDERS:-}
      VERLOF_JAAR: ${VERLOF_JAAR:-2026}
    volumes:
      # Het gegenereerde dashboard: VM-only, nooit in git.
      - hr-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3013/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Boekhouding - factureren vanuit Monday naar Octopus, plus de opvolging van
  # openstaande posten en de wachtrekening. Overgenomen van Joan's lokale
  # scripts (aanlevering 2026-07-30). Eigen repo softwareglobaal/globaal-
  # boekhouding, uitgecheckt op de VM in ./boekhouding met auto-deploy via
  # deploy-stack.sh en cron.
  app-boekhouding:
    build:
      context: ./boekhouding
      dockerfile: app/Dockerfile
    image: appportal-boekhouding
    restart: unless-stopped
    environment:
      PORT: "3014"
      # Eigen rol boekhouding_writer (migratie 102); leeg = nette melding.
      BOEKHOUDING_DB_URL: ${BOEKHOUDING_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      BOEKHOUDING_GROUPS: ${BOEKHOUDING_GROUPS:-boekhouding,manager}
      # Zelfde set als de Octopus-spiegel van de organisatie-app.
      OCTOPUS_SOFTWAREHOUSE_UUID: ${OCTOPUS_SOFTWAREHOUSE_UUID:-}
      OCTOPUS_USER: ${OCTOPUS_USER:-}
      OCTOPUS_PASSWORD: ${OCTOPUS_PASSWORD:-}
      # Eigen token als die er is, anders het bestaande volledige-account-token.
      # Nooit MONDAY_SANDBOX_TOKEN: dat is het lege zandbak-account.
      MONDAY_API_TOKEN: ${MONDAY_BOEKHOUDING_TOKEN:-${MONDAY_VOL_TOKEN:-}}
      # MCP voor Claude: alleen lezen. Leeg = het endpoint bestaat niet (404).
      MCP_TOKEN: ${BOEKHOUDING_MCP_TOKEN:-}
      MCP_SECRET: ${BOEKHOUDING_MCP_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3014/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  app-telefoonregister:
    build: ./telefoonregister
    image: appportal-telefoonregister
    restart: unless-stopped
    environment:
      DB_CLIENT: better-sqlite3
      PORT: "3006"
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - telefoonregister-data:/app/data
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3006/api/me',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]

  # Projecten — projectdashboard (projecten.globaal.be); eerste project
  # Thomas Berg (meeting 2026-07-14). Eigen repo (softwareglobaal/projecten,
  # met Raisha als outside collaborator), uitgecheckt op de VM in
  # ./projecten met auto-deploy via deploy.sh + cron.
  app-projecten:
    build: ./projecten
    image: appportal-projecten
    restart: unless-stopped
    environment:
      PORT: "3011"
      EDITOR_GROUPS: ${PROJECTEN_EDITOR_GROUPS:-projecten-editors,admin}
      VIEW_GROUPS: ${PROJECTEN_VIEW_GROUPS:-projecten,manager}
    volumes:
      - projecten-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3011/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Contactsync — Google Contacts -> Xelion-adresboek (one-way, Google is
  # de bron). Eigen repo (softwareglobaal/google-xelion-sync), uitgecheckt
  # op de VM in ./contactsync met auto-deploy via deploy.sh + cron.
  # Geheime bestanden in ./contactsync-data (bind-mount /data, buiten git);
  # de env_file is required:false zodat de stack blijft werken zolang de
  # bestanden nog niet overgezet zijn.
  app-contactsync:
    build: ./contactsync
    image: appportal-contactsync
    restart: unless-stopped
    env_file:
      - path: ./contactsync-data/.env
        required: false
    volumes:
      - ./contactsync-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Sales — Pipedrive-dashboard (sales.globaal.be). Eigen repo
  # (softwareglobaal/sales-dashboard), uitgecheckt op de VM in ./sales met
  # auto-deploy via deploy.sh + cron (2026-07-08), zoals de andere dashboards.
  app-sales:
    build: ./sales
    image: appportal-sales
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3008"
      HOSTNAME: 0.0.0.0
      PIPEDRIVE_TOKEN_HARCHITECTS: ${PIPEDRIVE_TOKEN_HARCHITECTS:-}
      PIPEDRIVE_TOKEN_UNABO: ${PIPEDRIVE_TOKEN_UNABO:-}
      PIPEDRIVE_TOKEN_TKNBURO: ${PIPEDRIVE_TOKEN_TKNBURO:-}
      PIPEDRIVE_TOKEN_ENERGIEEFFICIENT: ${PIPEDRIVE_TOKEN_ENERGIEEFFICIENT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Wie mag schrijven (notities/sync/analyse); besluit 2026-07-14:
      # joey en shelton volledige toegang. De middleware blijft staan
      # voor toekomstige kijk-accounts.
      EDITOR_USERS: ${SALES_EDITOR_USERS:-akadmin,mehdi,siyan,joey,shelton}
    volumes:
      - sales-data:/app/data
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3008/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [appnet]

  # Medewerkers — forward-auth dashboard op de centrale gebruikersdatabase.
  app-medewerkers:
    build: ./medewerkers
    image: appportal-medewerkers
    restart: unless-stopped
    environment:
      # Toegangsgroepen naast admin/manager (bv. hr, besluit 2026-07-13).
      # Staf-groepen: mogen de medewerkerskant zien (medewerkers, firma's,
      # disciplines, woordenboek). De beheerkant (financien, relaties,
      # signalen, ontwikkeling, graaf) blijft admin en manager. 'organisatie'
      # is voor wie het dashboard nodig heeft zonder HR-dashboard erbij.
      STAFF_GROUPS: ${ORGANISATIE_STAFF_GROUPS:-hr,organisatie}
      # Ontwikkel-statistieken (migratie 074): gedeeld token voor de
      # Claude Code-hook-ingest; leeg = endpoint uit.
      ONTWIKKELING_TOKEN: ${ONTWIKKELING_TOKEN:-}
      # DeskTime-spiegel (migratie 033): API-key in .env; leeg = sync uit.
      DESKTIME_API_KEY: ${DESKTIME_API_KEY:-}
      # Octopus-spiegel (stap 4, migratie 062): standaard uit; credentials
      # in .env, OCTOPUS_ENABLED=true om de poller te starten.
      OCTOPUS_ENABLED: ${OCTOPUS_ENABLED:-false}
      OCTOPUS_SOFTWAREHOUSE_UUID: ${OCTOPUS_SOFTWAREHOUSE_UUID:-}
      OCTOPUS_USER: ${OCTOPUS_USER:-}
      OCTOPUS_PASSWORD: ${OCTOPUS_PASSWORD:-}
      OCTOPUS_SYNC_MIN: ${OCTOPUS_SYNC_MIN:-360}
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Hergebruikt de read-only 'portal'-rol op de appportal-database.
      DATABASE_URL: ${APPPORTAL_DB_URL:-}
      # Smalle schrijfrol (medewerker_writer): enkel werkgever + diensten-koppeling.
      APPPORTAL_WRITE_URL: ${APPPORTAL_WRITE_URL:-}
      PORT: "3007"
      # Read-only Authentik-API voor het "Toegang"-panel (leeg = feature uit).
      # auth.<domein> resolvet intern naar nginx (netwerk-alias), dus geen hairpin.
      AUTHENTIK_API_URL: https://auth.${BASE_DOMAIN}/api/v3
      AUTHENTIK_API_TOKEN: ${MEDEWERKERS_AUTHENTIK_TOKEN:-}
      APPS_FILE: /app/apps.yaml
      # Interne telefoonregister-API voor de profielsectie "Telefoonnummers".
      TELEFOON_API_URL: http://app-telefoonregister:3006
      # AI-lezer op de organisatie-graph (leeg = AI-paneel uit).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      # Fathom-sync: komma-gescheiden API-keys van de opnemer-accounts (leeg = uit).
      FATHOM_API_KEYS: ${FATHOM_API_KEYS:-}
      # Wie het woordenboek mag bewerken (Authentik-usernames, komma-gescheiden).
      WOORDENBOEK_EDITORS: ${WOORDENBOEK_EDITORS:-mehdi,akadmin}
    volumes:
      - ./apps.yaml:/app/apps.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3007/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Communicatie — telefoonnummers + e-mailadressen, gelinkt aan kern (Postgres).
  # Opvolger-in-opbouw van het telefoonregister; die app blijft ernaast draaien.
  app-communicatie:
    build: ./communicatie
    image: appportal-communicatie
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'communicatie': leest kern, schrijft schema communicatie (db/roles.sql).
      DATABASE_URL: ${COMMUNICATIE_DB_URL:-}
      PORT: "3008"
      # Wie mag bewerken (komma-gescheiden Authentik-groepen).
      EDITOR_GROUPS: communicatie-editors,admin
      # Xelion-koppeling (migratie 028): poller spiegelt de belvolgorde.
      # Credentials in .env op de VM (nooit in git); zonder waarden blijft
      # de Xelion-kolom leeg. XELION_DEBUG mag uit na de eerste verificatie.
      # Aan/uit via .env — bij foute creds elke 5 min blijven proberen jaagt
      # de loginFailures-teller in Xelion op (accountvergrendeling).
      XELION_ENABLED: ${XELION_ENABLED:-false}
      # Kostenadviseur (fase 2b): AI-weging via dezelfde sleutel als de
      # organisatie-app; leeg = terugval op de deterministische regels.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      XELION_DEBUG: "${XELION_DEBUG:-false}"
      XELION_BASE_URL: ${XELION_BASE_URL:-}
      XELION_USERSPACE: ${XELION_USERSPACE:-}
      XELION_USERNAME: ${XELION_USERNAME:-}
      XELION_PASSWORD: ${XELION_PASSWORD:-}
      # Optioneel; wordt volgens Xelion binnenkort verplicht (aanvragen bij Xelion).
      XELION_APP_KEY: ${XELION_APP_KEY:-}
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3008/api/me',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]

  # Vermogen — panden / verzekeringen / leningen & leasingen / syndicus (skelet).
  app-vermogen:
    build: ./vermogen
    image: appportal-vermogen
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'vermogen': leest kern, schrijft schema vermogen (db/roles.sql).
      DATABASE_URL: ${VERMOGEN_DB_URL:-}
      PORT: "3009"
      # Wie mag bewerken (komma-gescheiden Authentik-groepen).
      EDITOR_GROUPS: vermogen-editors,admin
      # Bearer-token voor het MCP-endpoint (/mcp, Claude); leeg = endpoint uit.
      MCP_TOKEN: ${VERMOGEN_MCP_TOKEN:-}
      # HMAC-secret voor de OAuth-tokens van claude.ai-connectors; leeg = uit.
      MCP_SECRET: ${VERMOGEN_MCP_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3009/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Draaiboek — playbook-management: sjabloon -> run, kickoff, condities.
  app-draaiboek:
    build: ./draaiboek
    image: appportal-draaiboek
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'draaiboek': leest kern, schrijft schema draaiboek (db/roles.sql).
      DATABASE_URL: ${DRAAIBOEK_DB_URL:-}
      PORT: "3010"
      # Wie de app mag gebruiken (komma-gescheiden Authentik-groepen).
      TOEGANG_GROEPEN: admin,manager,draaiboek
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  app-monday:
    build:
      context: ./monday
      dockerfile: app/Dockerfile
    image: appportal-monday
    restart: unless-stopped
    environment:
      PORT: "3014"
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      # Eigen rol (migratie 078); leeg = app toont een nette melding.
      MONDAY_DB_URL: ${MONDAY_DB_URL:-}
      # Alleen het lege zandbak-account "Open". Nooit een echte-account-token.
      MONDAY_SANDBOX_TOKEN: ${MONDAY_SANDBOX_TOKEN:-}
      MONDAY_GROUPS: ${MONDAY_GROUPS:-monday}
      # Geheime token voor de MCP-connector (/mcp/<token>); leeg = endpoint uit.
      MONDAY_MCP_TOKEN: ${MONDAY_MCP_TOKEN:-}
      # Aparte token voor de zandbak-connector (/mcp-zandbak/<token>), die wel
      # mag schrijven maar uitsluitend in het lege account.
      MONDAY_MCP_ZANDBAK_TOKEN: ${MONDAY_MCP_ZANDBAK_TOKEN:-}
    volumes:
      # Graphify-graaf over de memory, gebouwd door monday/scripts/build-graaf.sh.
      - ./monday-graaf:/graaf:ro
    # De tegel proxyt vragen naar de host-side LightRAG-query-service (8791).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3014/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Items — verkoop-etalage tweedehands ICT met AI-taxatie.
  # Beheer-tegel achter forward-auth (items.globaal.be); gebruiker via X-authentik-* headers.
  app-items:
    build: ./items
    image: appportal-items
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ITEMS_ROLE: beheer
      PORT: "3015"
      # Rol 'items_writer': schrijft schema items (db/migrations/079-items.sql).
      ITEMS_DB_URL: ${ITEMS_DB_URL:-}
      ITEMS_UPLOAD_DIR: /data/fotos
      # Leeg = iedereen die door forward-auth komt mag bewerken.
      EDITOR_GROUPS: ${ITEMS_EDITOR_GROUPS:-}
      # Nodig voor de AI-taxatie (Claude Sonnet).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VALUATION_EFFORT: ${VALUATION_EFFORT:-medium}
    volumes:
      - items-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3015/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Publieke verkoop-etalage (read-only, eigen poort 8770, GEEN SSO, geen beheerknop).
  items-verkoop:
    build: ./items
    image: appportal-items
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ITEMS_ROLE: verkoop
      PORT: "8770"
      ITEMS_DB_URL: ${ITEMS_DB_URL:-}
      ITEMS_UPLOAD_DIR: /data/fotos
      CONTACT_TELEFOON: ${CONTACT_TELEFOON:-}
    ports:
      - "8770:8770"
    volumes:
      - items-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Angela - werkdashboard initiatief Suriname (angela.globaal.be).
  # Achter forward-auth; gebruiker via X-authentik-* headers.
  app-angela:
    build: ./angela
    image: appportal-angela
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3016"
      # Rol 'angela_writer': schrijft schema angela, leest kern.persoon
      # (db/migrations/097-angela.sql).
      ANGELA_DB_URL: ${ANGELA_DB_URL:-}
      ANGELA_UPLOAD_DIR: /data/bijlagen
      # Moet gelijk lopen met client_max_body_size in 54-angela.conf.template.
      ANGELA_MAX_UPLOAD_MB: "50"
      # Leeg = iedereen die door forward-auth komt mag bewerken.
      EDITOR_GROUPS: ${ANGELA_EDITOR_GROUPS:-}
    volumes:
      - angela-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3016/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

volumes:
  telefoonregister-data:
  sales-data:
  projecten-data:
  hr-data:
  items-data:
  angela-data:
