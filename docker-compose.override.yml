services:
  # De appportal-Postgres op loopback voor host-services (kosten-dashboard):
  # gedocumenteerd contract in globaal-kosten/deploy/appportal. Stond eerder
  # alleen als handmatige wijziging op de VM en verdween daardoor bij het
  # incident-herstel van 2026-07-14; vanaf nu in git (de omv-v2-les).
  # 5432 op de host is bezet door de losse native Postgres, daarom 5433.
  postgresql:
    ports:
      - "127.0.0.1:5433:5432"

  # Kosten-dashboard, herbouw als stack-app (besluit Shaniel 2026-07-15):
  # leest alles uit de database (kosten.bank_transactie + Octopus-spiegel);
  # de PDF-pijplijn blijft als host-service draaien en is via hostmachine
  # bereikbaar voor de ververs-knop. Checkout: ~/appportal/kosten.
  app-kosten:
    build:
      context: ./kosten
      dockerfile: app/Dockerfile
    image: appportal-kosten
    restart: unless-stopped
    environment:
      PORT: "3012"
      KOSTEN_DB_URL: ${KOSTEN_STACK_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      VERVERS_URL: ${KOSTEN_VERVERS_URL:-http://hostmachine:8090/ververs}
    extra_hosts:
      - "hostmachine:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3012/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  app-hr:
    build:
      context: ./hr
      dockerfile: app/Dockerfile
    image: appportal-hr
    restart: unless-stopped
    environment:
      PORT: "3013"
      # Eigen rol (migratie 075); leeg = app toont een nette melding.
      HR_DB_URL: ${HR_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      # Zelfde sleutel als de DeskTime-spiegel van de organisatie-app.
      DESKTIME_API_KEY: ${DESKTIME_API_KEY:-}
      HR_GROUPS: ${HR_GROUPS:-hr,manager}
      HR_VANAF: ${HR_VANAF:-2025-01-01}
      HR_HANDMATIG_VANAF: ${HR_HANDMATIG_VANAF:-2026-01-01}
      # Verlofdashboard (/verlof): leest een Google-agenda in een richting.
      # De sleutel is een servicegebruiker en staat op het hr-data-volume, niet
      # in git. Zonder deze drie draait de app gewoon door, alleen zonder sync.
      GOOGLE_CALENDAR_KEY: ${GOOGLE_CALENDAR_KEY:-}
      VERLOF_KALENDERS: ${VERLOF_KALENDERS:-}
      VERLOF_JAAR: ${VERLOF_JAAR:-2026}
    volumes:
      # Het gegenereerde dashboard: VM-only, nooit in git.
      - hr-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3013/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Boekhouding - factureren vanuit Monday naar Octopus, plus de opvolging van
  # openstaande posten en de wachtrekening. Overgenomen van Joan's lokale
  # scripts (aanlevering 2026-07-30). Eigen repo softwareglobaal/globaal-
  # boekhouding, uitgecheckt op de VM in ./boekhouding met auto-deploy via
  # deploy-stack.sh en cron.
  app-boekhouding:
    build:
      context: ./boekhouding
      dockerfile: app/Dockerfile
    image: appportal-boekhouding
    restart: unless-stopped
    environment:
      PORT: "3014"
      # Eigen rol boekhouding_writer (migratie 102); leeg = nette melding.
      BOEKHOUDING_DB_URL: ${BOEKHOUDING_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      BOEKHOUDING_GROUPS: ${BOEKHOUDING_GROUPS:-boekhouding,manager}
      # Zelfde set als de Octopus-spiegel van de organisatie-app.
      OCTOPUS_SOFTWAREHOUSE_UUID: ${OCTOPUS_SOFTWAREHOUSE_UUID:-}
      OCTOPUS_USER: ${OCTOPUS_USER:-}
      OCTOPUS_PASSWORD: ${OCTOPUS_PASSWORD:-}
      # Eigen token als die er is, anders het bestaande volledige-account-token.
      # Nooit MONDAY_SANDBOX_TOKEN: dat is het lege zandbak-account.
      MONDAY_API_TOKEN: ${MONDAY_BOEKHOUDING_TOKEN:-${MONDAY_VOL_TOKEN:-}}
      # MCP voor Claude: alleen lezen. Leeg = het endpoint bestaat niet (404).
      MCP_TOKEN: ${BOEKHOUDING_MCP_TOKEN:-}
      MCP_SECRET: ${BOEKHOUDING_MCP_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3014/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # QuickBooks-connector voor HDS (Suriname). Tweede boekhoudsysteem naast
  # Octopus; MCP-server zodat Claude die boekhouding kan lezen en beperkt
  # bijwerken. Eigen repo softwareglobaal/globaal-quickbooks, uitgecheckt in
  # ./quickbooks met auto-deploy via deploy-stack.sh en cron.
  # Energie-Efficient: sales van die firma plus het SketchUp-kookboek van de
  # EPB-tekenaars. Leest alleen, en allebei de bronnen read-only:
  #  - sales-data is het volume van het sales-dashboard (SQLite-spiegel van
  #    Pipedrive). Geen tweede token, geen tweede waarheid.
  #  - ./sketchup-mcp is een checkout van globaal-sketchup-mcp, zodat het
  #    kookboek zichtbaar is zonder dat iemand in GitHub hoeft te kunnen.
  # Eigen repo softwareglobaal/globaal-energie-efficient, uitgecheckt in
  # ./energie-efficient met auto-deploy via deploy-stack.sh en cron.
  app-energie-efficient:
    build:
      context: ./energie-efficient
      dockerfile: app/Dockerfile
    image: appportal-energie-efficient
    restart: unless-stopped
    environment:
      PORT: "3016"
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      EE_GROUPS: ${EE_GROUPS:-epb,manager}
      SALES_DB: /sales/dashboard.db
      SALES_ACCOUNT: ${EE_SALES_ACCOUNT:-energieefficient}
      KOOKBOEK_MAP: /kookboek
    volumes:
      - sales-data:/sales:ro
      - ./sketchup-mcp:/kookboek:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3016/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  app-quickbooks:
    build:
      context: ./quickbooks
      dockerfile: app/Dockerfile
    image: appportal-quickbooks
    restart: unless-stopped
    environment:
      PORT: "3015"
      # Eigen rol quickbooks_writer (migratie 115); leeg = nette melding.
      QUICKBOOKS_DB_URL: ${QUICKBOOKS_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      QUICKBOOKS_GROUPS: ${QUICKBOOKS_GROUPS:-boekhouding,manager}
      # Production keys van de Intuit-app MCP (workspace HDS).
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      # MCP voor Claude; leeg = het endpoint bestaat niet.
      MCP_TOKEN: ${QUICKBOOKS_MCP_TOKEN:-}
      MCP_SECRET: ${QUICKBOOKS_MCP_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3015/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Intercompany: onderlinge facturatie tussen de eigen firma's. High Design
  # Studio (Suriname) factureert maandelijks aan de Belgische firma's; deze app
  # spiegelt wat daarvan in Octopus staat. Leest alleen. Niet te verwarren met
  # app-boekhouding, dat over facturatie aan KLANTEN gaat. Eigen repo
  # softwareglobaal/globaal-intercompany, uitgecheckt in ./intercompany met
  # auto-deploy via deploy-stack.sh en cron.
  app-intercompany:
    build:
      context: ./intercompany
      dockerfile: app/Dockerfile
    image: appportal-intercompany
    restart: unless-stopped
    environment:
      PORT: "3016"
      # Eigen rol intercompany_writer (migratie 118); leeg = nette melding.
      INTERCOMPANY_DB_URL: ${INTERCOMPANY_DB_URL:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      INTERCOMPANY_GROUPS: ${INTERCOMPANY_GROUPS:-boekhouding,manager}
      # Zelfde set als de Octopus-spiegel van de organisatie-app.
      OCTOPUS_SOFTWAREHOUSE_UUID: ${OCTOPUS_SOFTWAREHOUSE_UUID:-}
      OCTOPUS_USER: ${OCTOPUS_USER:-}
      OCTOPUS_PASSWORD: ${OCTOPUS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3016/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  app-telefoonregister:
    build: ./telefoonregister
    image: appportal-telefoonregister
    restart: unless-stopped
    environment:
      DB_CLIENT: better-sqlite3
      PORT: "3006"
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - telefoonregister-data:/app/data
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3006/api/me',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]

  # Projecten — projectdashboard (projecten.globaal.be); eerste project
  # Thomas Berg (meeting 2026-07-14). Eigen repo (softwareglobaal/projecten,
  # met Raisha als outside collaborator), uitgecheckt op de VM in
  # ./projecten met auto-deploy via deploy.sh + cron.
  app-projecten:
    build: ./projecten
    image: appportal-projecten
    restart: unless-stopped
    environment:
      PORT: "3011"
      EDITOR_GROUPS: ${PROJECTEN_EDITOR_GROUPS:-projecten-editors,admin}
      VIEW_GROUPS: ${PROJECTEN_VIEW_GROUPS:-projecten,manager}
    volumes:
      - projecten-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3011/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Contactsync — Google Contacts -> Xelion-adresboek (one-way, Google is
  # de bron). Eigen repo (softwareglobaal/google-xelion-sync), uitgecheckt
  # op de VM in ./contactsync met auto-deploy via deploy.sh + cron.
  # Geheime bestanden in ./contactsync-data (bind-mount /data, buiten git);
  # de env_file is required:false zodat de stack blijft werken zolang de
  # bestanden nog niet overgezet zijn.
  app-contactsync:
    build: ./contactsync
    image: appportal-contactsync
    restart: unless-stopped
    env_file:
      - path: ./contactsync-data/.env
        required: false
    volumes:
      - ./contactsync-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [appnet]

  # Sales — Pipedrive-dashboard (sales.globaal.be). Eigen repo
  # (softwareglobaal/sales-dashboard), uitgecheckt op de VM in ./sales met
  # auto-deploy via deploy.sh + cron (2026-07-08), zoals de andere dashboards.
  app-sales:
    build: ./sales
    image: appportal-sales
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3008"
      HOSTNAME: 0.0.0.0
      PIPEDRIVE_TOKEN_HARCHITECTS: ${PIPEDRIVE_TOKEN_HARCHITECTS:-}
      PIPEDRIVE_TOKEN_UNABO: ${PIPEDRIVE_TOKEN_UNABO:-}
      PIPEDRIVE_TOKEN_TKNBURO: ${PIPEDRIVE_TOKEN_TKNBURO:-}
      PIPEDRIVE_TOKEN_ENERGIEEFFICIENT: ${PIPEDRIVE_TOKEN_ENERGIEEFFICIENT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Google Ads (SEO/SEA-tab). Stonden alleen in .env en werden nooit
      # doorgegeven; na een herbouw viel de advertentie-sync daardoor stil
      # zonder foutmelding (2026-08-24).
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      # Concurrentiemonitor Energie. Zelfde valkuil als hierboven: staat een
      # variabele alleen in .env en niet hier, dan bereikt hij de app nooit
      # en faalt de koppeling geruisloos.
      GSC_CLIENT_ID: ${GSC_CLIENT_ID:-}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET:-}
      GSC_REFRESH_TOKEN: ${GSC_REFRESH_TOKEN:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      # Token voor de agent-API (/api/v1). Leeg = API uit.
      SALES_AGENT_TOKEN: ${SALES_AGENT_TOKEN:-}
      # Wie mag schrijven (notities/sync/analyse); besluit 2026-07-14:
      # joey en shelton volledige toegang. De middleware blijft staan
      # voor toekomstige kijk-accounts.
      EDITOR_USERS: ${SALES_EDITOR_USERS:-akadmin,mehdi,siyan,joey,shelton}
    volumes:
      - sales-data:/app/data
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3008/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [appnet]

  # Medewerkers — forward-auth dashboard op de centrale gebruikersdatabase.
  app-medewerkers:
    build: ./medewerkers
    image: appportal-medewerkers
    restart: unless-stopped
    environment:
      # Toegangsgroepen naast admin/manager (bv. hr, besluit 2026-07-13).
      # Staf-groepen: mogen de medewerkerskant zien (medewerkers, firma's,
      # disciplines, woordenboek). De beheerkant (financien, relaties,
      # signalen, ontwikkeling, graaf) blijft admin en manager. 'organisatie'
      # is voor wie het dashboard nodig heeft zonder HR-dashboard erbij.
      STAFF_GROUPS: ${ORGANISATIE_STAFF_GROUPS:-hr,organisatie}
      # Ontwikkel-statistieken (migratie 074): gedeeld token voor de
      # Claude Code-hook-ingest; leeg = endpoint uit.
      ONTWIKKELING_TOKEN: ${ONTWIKKELING_TOKEN:-}
      # DeskTime-spiegel (migratie 033): API-key in .env; leeg = sync uit.
      DESKTIME_API_KEY: ${DESKTIME_API_KEY:-}
      # Octopus-spiegel (stap 4, migratie 062): standaard uit; credentials
      # in .env, OCTOPUS_ENABLED=true om de poller te starten.
      OCTOPUS_ENABLED: ${OCTOPUS_ENABLED:-false}
      OCTOPUS_SOFTWAREHOUSE_UUID: ${OCTOPUS_SOFTWAREHOUSE_UUID:-}
      OCTOPUS_USER: ${OCTOPUS_USER:-}
      OCTOPUS_PASSWORD: ${OCTOPUS_PASSWORD:-}
      OCTOPUS_SYNC_MIN: ${OCTOPUS_SYNC_MIN:-360}
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Hergebruikt de read-only 'portal'-rol op de appportal-database.
      DATABASE_URL: ${APPPORTAL_DB_URL:-}
      # Smalle schrijfrol (medewerker_writer): enkel werkgever + diensten-koppeling.
      APPPORTAL_WRITE_URL: ${APPPORTAL_WRITE_URL:-}
      PORT: "3007"
      # Read-only Authentik-API voor het "Toegang"-panel (leeg = feature uit).
      # auth.<domein> resolvet intern naar nginx (netwerk-alias), dus geen hairpin.
      AUTHENTIK_API_URL: https://auth.${BASE_DOMAIN}/api/v3
      AUTHENTIK_API_TOKEN: ${MEDEWERKERS_AUTHENTIK_TOKEN:-}
      APPS_FILE: /app/apps.yaml
      # Interne telefoonregister-API voor de profielsectie "Telefoonnummers".
      TELEFOON_API_URL: http://app-telefoonregister:3006
      # AI-lezer op de organisatie-graph (leeg = AI-paneel uit).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      # Fathom-sync: komma-gescheiden API-keys van de opnemer-accounts (leeg = uit).
      FATHOM_API_KEYS: ${FATHOM_API_KEYS:-}
      # Wie het woordenboek mag bewerken (Authentik-usernames, komma-gescheiden).
      WOORDENBOEK_EDITORS: ${WOORDENBOEK_EDITORS:-mehdi,akadmin}
    volumes:
      - ./apps.yaml:/app/apps.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3007/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Namenlijst — wie werkt hier, met eigen kolommen per gebruiker
  # (namen.globaal.be). Losgemaakt uit het Organisatie-dashboard (2026-08-21)
  # zodat het een eigen repo heeft (softwareglobaal/globaal-namen, met Sufa
  # als outside collaborator), uitgecheckt op de VM in ./namen met
  # auto-deploy via deploy.sh + cron, zoals projecten.
  app-namen:
    build: ./namen
    image: appportal-namen
    restart: unless-stopped
    environment:
      PORT: "3018"
      # Zelfde rollen als het Organisatie-dashboard: read-only 'portal' voor
      # de lijst, medewerker_writer voor de eigen kolommen (migratie 123).
      DATABASE_URL: ${APPPORTAL_DB_URL:-}
      APPPORTAL_WRITE_URL: ${APPPORTAL_WRITE_URL:-}
      # Wie de lijst mag zien: de eigen groep plus wie het Organisatie-
      # dashboard al mocht zien (daar stond de pagina eerst).
      NAMEN_GROUPS: ${NAMEN_GROUPS:-namenlijst,hr,organisatie,admin,manager}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3018/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Communicatie — telefoonnummers + e-mailadressen, gelinkt aan kern (Postgres).
  # Opvolger-in-opbouw van het telefoonregister; die app blijft ernaast draaien.
  app-communicatie:
    build: ./communicatie
    image: appportal-communicatie
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'communicatie': leest kern, schrijft schema communicatie (db/roles.sql).
      DATABASE_URL: ${COMMUNICATIE_DB_URL:-}
      PORT: "3008"
      # Wie mag bewerken (komma-gescheiden Authentik-groepen).
      EDITOR_GROUPS: communicatie-editors,admin
      # Xelion-koppeling (migratie 028): poller spiegelt de belvolgorde.
      # Credentials in .env op de VM (nooit in git); zonder waarden blijft
      # de Xelion-kolom leeg. XELION_DEBUG mag uit na de eerste verificatie.
      # Aan/uit via .env — bij foute creds elke 5 min blijven proberen jaagt
      # de loginFailures-teller in Xelion op (accountvergrendeling).
      XELION_ENABLED: ${XELION_ENABLED:-false}
      # Kostenadviseur (fase 2b): AI-weging via dezelfde sleutel als de
      # organisatie-app; leeg = terugval op de deterministische regels.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      XELION_DEBUG: "${XELION_DEBUG:-false}"
      XELION_BASE_URL: ${XELION_BASE_URL:-}
      XELION_USERSPACE: ${XELION_USERSPACE:-}
      XELION_USERNAME: ${XELION_USERNAME:-}
      XELION_PASSWORD: ${XELION_PASSWORD:-}
      # Optioneel; wordt volgens Xelion binnenkort verplicht (aanvragen bij Xelion).
      XELION_APP_KEY: ${XELION_APP_KEY:-}
    healthcheck:
      test: node -e "require('http').get('http://127.0.0.1:3008/api/me',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]

  # Vermogen — panden / verzekeringen / leningen & leasingen / syndicus (skelet).
  app-vermogen:
    build: ./vermogen
    image: appportal-vermogen
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'vermogen': leest kern, schrijft schema vermogen (db/roles.sql).
      DATABASE_URL: ${VERMOGEN_DB_URL:-}
      PORT: "3009"
      # Wie mag bewerken (komma-gescheiden Authentik-groepen).
      EDITOR_GROUPS: vermogen-editors,admin
      # Bearer-token voor het MCP-endpoint (/mcp, Claude); leeg = endpoint uit.
      MCP_TOKEN: ${VERMOGEN_MCP_TOKEN:-}
      # HMAC-secret voor de OAuth-tokens van claude.ai-connectors; leeg = uit.
      MCP_SECRET: ${VERMOGEN_MCP_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3009/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Draaiboek — playbook-management: sjabloon -> run, kickoff, condities.
  app-draaiboek:
    build: ./draaiboek
    image: appportal-draaiboek
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Rol 'draaiboek': leest kern, schrijft schema draaiboek (db/roles.sql).
      DATABASE_URL: ${DRAAIBOEK_DB_URL:-}
      PORT: "3010"
      # Wie de app mag gebruiken (komma-gescheiden Authentik-groepen).
      TOEGANG_GROEPEN: admin,manager,draaiboek
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  app-monday:
    build:
      context: ./monday
      dockerfile: app/Dockerfile
    image: appportal-monday
    restart: unless-stopped
    environment:
      PORT: "3014"
      BASE_DOMAIN: ${BASE_DOMAIN:-globaal.be}
      # Eigen rol (migratie 078); leeg = app toont een nette melding.
      MONDAY_DB_URL: ${MONDAY_DB_URL:-}
      # Alleen het lege zandbak-account "Open". Nooit een echte-account-token.
      MONDAY_SANDBOX_TOKEN: ${MONDAY_SANDBOX_TOKEN:-}
      MONDAY_GROUPS: ${MONDAY_GROUPS:-monday}
      # Geheime token voor de MCP-connector (/mcp/<token>); leeg = endpoint uit.
      MONDAY_MCP_TOKEN: ${MONDAY_MCP_TOKEN:-}
      # Aparte token voor de zandbak-connector (/mcp-zandbak/<token>), die wel
      # mag schrijven maar uitsluitend in het lege account.
      MONDAY_MCP_ZANDBAK_TOKEN: ${MONDAY_MCP_ZANDBAK_TOKEN:-}
    volumes:
      # Graphify-graaf over de memory, gebouwd door monday/scripts/build-graaf.sh.
      - ./monday-graaf:/graaf:ro
    # De tegel proxyt vragen naar de host-side LightRAG-query-service (8791).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3014/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Items - verkoop-etalage Angela (angela.sr): tweedehands per sectie, met AI-taxatie.
  # Beheer-tegel achter forward-auth (items.globaal.be); gebruiker via X-authentik-* headers.
  # Eigen repo softwareglobaal/angela-site, uitgecheckt op de VM in
  # ./angela-site met auto-deploy via deploy-stack.sh en cron.
  app-items:
    build: ./angela-site/app
    image: appportal-items
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ITEMS_ROLE: beheer
      PORT: "3015"
      # Rol 'items_writer': schrijft schema items (db/migrations/079-items.sql).
      ITEMS_DB_URL: ${ITEMS_DB_URL:-}
      ITEMS_UPLOAD_DIR: /data/fotos
      # Leeg = iedereen die door forward-auth komt mag bewerken.
      EDITOR_GROUPS: ${ITEMS_EDITOR_GROUPS:-}
      # Nodig voor de AI-taxatie (Claude Sonnet).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VALUATION_EFFORT: ${VALUATION_EFFORT:-medium}
      # MCP-endpoint op https://angela.sr/mcp: Angela beheert de site via
      # Claude (angela-site/app/mcp_server.py). Leeg = endpoint uit (404).
      MCP_SECRET: ${ANGELA_MCP_SECRET:-}
      MCP_TOKEN: ${ANGELA_MCP_TOKEN:-}
      CONTACT_TELEFOON: ${CONTACT_TELEFOON:-}
      WHATSAPP_NUMMER: ${WHATSAPP_NUMMER:-}
      MUNT_SYMBOOL: ${MUNT_SYMBOOL:-}
      MUNT_CODE: ${MUNT_CODE:-}
    volumes:
      - items-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3015/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Publieke verkoop-etalage (read-only, eigen poort 8770, GEEN SSO, geen beheerknop).
  items-verkoop:
    build: ./angela-site/app
    image: appportal-items
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ITEMS_ROLE: verkoop
      PORT: "8770"
      ITEMS_DB_URL: ${ITEMS_DB_URL:-}
      ITEMS_UPLOAD_DIR: /data/fotos
      CONTACT_TELEFOON: ${CONTACT_TELEFOON:-}
      WHATSAPP_NUMMER: ${WHATSAPP_NUMMER:-}
      MUNT_SYMBOOL: ${MUNT_SYMBOOL:-}
      MUNT_CODE: ${MUNT_CODE:-}
    ports:
      - "8770:8770"
    volumes:
      - items-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Angela - werkdashboard initiatief Suriname (angela.globaal.be).
  # Achter forward-auth; gebruiker via X-authentik-* headers.
  app-angela:
    build: ./angela
    image: appportal-angela
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3016"
      # Rol 'angela_writer': schrijft schema angela, leest kern.persoon
      # (db/migrations/097-angela.sql).
      ANGELA_DB_URL: ${ANGELA_DB_URL:-}
      ANGELA_UPLOAD_DIR: /data/bijlagen
      # Moet gelijk lopen met client_max_body_size in 54-angela.conf.template.
      ANGELA_MAX_UPLOAD_MB: "50"
      # Leeg = iedereen die door forward-auth komt mag bewerken.
      EDITOR_GROUPS: ${ANGELA_EDITOR_GROUPS:-}
    volumes:
      - angela-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3016/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Postbus - mailboxtoegang voor Claude (MCP over IMAP).
  # De pagina staat achter forward-auth; het MCP-endpoint checkt zelf het token
  # en leidt de toegang af uit de Authentik-groepen in dat token.
  # Wat per mailbox mag (ordenen, doorsturen, verwijderen, versturen) staat in
  # mailboxen.yaml en is zichtbaar op de beheerpagina. Verwijderen en versturen
  # hebben daarnaast elk een server-noodrem hieronder; staan die uit, dan
  # gebeurt het bij geen enkele mailbox.
  app-post:
    build: ./post
    image: appportal-post
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3017"
      POSTBUS_CONFIG: /config/mailboxen.yaml
      # Wie de beheersectie en de verbindingstest ziet.
      POSTBUS_BEHEER_GROEPEN: ${POSTBUS_BEHEER_GROEPEN:-admin}
      # claude.ai-connector (OAuth via Authentik-SSO); leeg = endpoint uit.
      MCP_SECRET: ${POSTBUS_MCP_SECRET:-}
      # Statisch token voor Claude Code; leeg = uit. Dit token hoort bij geen
      # enkele Authentik-gebruiker en krijgt daarom alleen de groepen die
      # hieronder staan. Leeg gelaten = geen enkele mailbox leesbaar.
      MCP_TOKEN: ${POSTBUS_MCP_TOKEN:-}
      POSTBUS_TOKEN_GROEPEN: ${POSTBUS_TOKEN_GROEPEN:-}
      # Noodrem voor uitgaande post. Staat dit niet op 'ja', dan stuurt de
      # server niets door, ook niet bij een mailbox die het volgens
      # mailboxen.yaml mag. Zo zet je alles in een keer stil zonder aan de
      # mailboxen te komen.
      POSTBUS_DOORSTUREN: ${POSTBUS_DOORSTUREN:-}
      POSTBUS_DOORSTUREN_DAGPLAFOND: ${POSTBUS_DOORSTUREN_DAGPLAFOND:-100}
      # Noodrem voor verwijderen (naar de prullenbak) en voor het echt
      # versturen van een zelf opgesteld bericht. Beide standaard uit: staat
      # dit niet op 'ja', dan gebeurt het bij geen enkele mailbox, ook niet als
      # mailboxen.yaml het toestaat. Het dagplafond van versturen wordt gedeeld
      # met doorsturen (POSTBUS_DOORSTUREN_DAGPLAFOND).
      POSTBUS_VERWIJDEREN: ${POSTBUS_VERWIJDEREN:-}
      POSTBUS_VERZENDEN: ${POSTBUS_VERZENDEN:-}
    volumes:
      # De mailboxen met hun wachtwoorden: één bestand op de VM, buiten git,
      # read-only aangekoppeld. Bewerken met: nano ~/post-config/mailboxen.yaml
      - ${POSTBUS_CONFIG_DIR:-/home/ubuntu/post-config}:/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3017/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [appnet]

  # Doorstuuragent - draait uit zichzelf, los van de connector. Kijkt met een
  # vast ritme in een mailbox en stuurt door wat aan de regel voldoet (nu: de
  # facturen van Anthropic naar de boekhouding). Zelfde image en zelfde
  # mailboxen.yaml als app-post; het gebruikt dezelfde verzendcode, dus dezelfde
  # noodrem (POSTBUS_DOORSTUREN) en dezelfde allowlist per mailbox gelden.
  app-post-agent:
    build: ./post
    image: appportal-post
    restart: unless-stopped
    command: ["python", "doorstuuragent.py"]
    environment:
      POSTBUS_CONFIG: /config/mailboxen.yaml
      POSTBUS_DOORSTUREN: ${POSTBUS_DOORSTUREN:-}
      POSTBUS_DOORSTUREN_DAGPLAFOND: ${POSTBUS_DOORSTUREN_DAGPLAFOND:-100}
      # De regel: welke mailbox, welk onderwerp, waarheen. De bestemming moet
      # ook in 'doorsturen:' van die mailbox staan, anders weigert het versturen.
      POSTBUS_AGENT_MAILBOX: ${POSTBUS_AGENT_MAILBOX:-}
      POSTBUS_AGENT_ONDERWERP: ${POSTBUS_AGENT_ONDERWERP:-}
      POSTBUS_AGENT_NAAR: ${POSTBUS_AGENT_NAAR:-}
      POSTBUS_AGENT_MAP: ${POSTBUS_AGENT_MAP:-INBOX}
      POSTBUS_AGENT_INTERVAL: ${POSTBUS_AGENT_INTERVAL:-300}
      # Standaard leeg: bij de eerste start worden bestaande berichten NIET
      # doorgestuurd, alleen onthouden. Zet op 'ja' om de geschiedenis alsnog
      # in een keer door te sturen.
      POSTBUS_AGENT_BACKFILL: ${POSTBUS_AGENT_BACKFILL:-}
      POSTBUS_AGENT_STATE: /state/doorgestuurd.json
    volumes:
      - ${POSTBUS_CONFIG_DIR:-/home/ubuntu/post-config}:/config:ro
      # Schrijfbaar: hier onthoudt de agent wat al doorgestuurd is, zodat een
      # herstart niets herhaalt.
      - post-agent-state:/state
    networks: [appnet]

  # Contracten — contracten H-Architects, dossiercontrole en salesproces.
  # De Word-masters zitten in de repo; LibreOffice in het image maakt de pdf.
  app-contracten:
    build: ./contracten
    image: appportal-contracten
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      PORT: "3022"
      TOEGANG_GROEPEN: admin,manager,contracten
      PIPEDRIVE_API_TOKEN: ${CONTRACTEN_PIPEDRIVE_TOKEN:-}
      PANDADOC_API_KEY: ${CONTRACTEN_PANDADOC_KEY:-}
      # Dropbox wordt via de API bevraagd, niet via een gekoppelde map.
      DROPBOX_TOKEN: ${CONTRACTEN_DROPBOX_TOKEN:-}
      # Deze paden bestaan niet op de VM; leeg laten zorgt ervoor dat de
      # bijhorende controles 'onbekend' melden in plaats van 'in orde'.
      SALES_BASIS: ""
      CONTRACT_BASIS: ""
      OFFERTE_SCRIPT: ""
      FOTOBIBLIOTHEEK: ""
    volumes:
      # Gegenereerde contracten en ingevulde dossiers overleven een herbouw.
      - contracten-output:/app/Output
      - contracten-input:/app/Input
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3022/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]

volumes:
  contracten-output:
  contracten-input:
  post-agent-state:
  telefoonregister-data:
  sales-data:
  projecten-data:
  hr-data:
  items-data:
  angela-data:
