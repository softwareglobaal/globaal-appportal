# Vroege waarschuwing voor de locatietegel en De Locatiewacht. De harde grendel zit
# in locatie/Dockerfile: daar weigert de uitrol op de VM als deze tests falen.
# Opdracht v1.2 (04-10-2026): ook het bronbeleid, de planning van de VM, de
# projectherkenning, de export en de archivaris (die de dagboeken leest).
name: locatie-grendels

on:
  push:
    paths: ["locatie/**", "mijnagents-runner/locatie_wacht.py", "mijnagents-runner/tests/test_locatie_wacht.py",
            "mijnagents-runner/planning/**", "mijnagents-runner/archivaris.py", "mijnagents-runner/levenscoach.py",
            "mijnagents-runner/plaud_wacht.py", "mijnagents-runner/dagbundelaar.py", "mijnagents-runner/agenda_wacht.py",
            "mijnagents-runner/fathom_wacht.py", "mijnagents-runner/koppelingen/**", "mijnagents/app.py", "docker-compose.yml",
            ".github/workflows/locatie-grendels.yml"]
  pull_request:
    paths: ["locatie/**", "mijnagents-runner/locatie_wacht.py", "mijnagents-runner/tests/test_locatie_wacht.py",
            "mijnagents-runner/planning/**", "mijnagents-runner/archivaris.py", "mijnagents-runner/levenscoach.py",
            "mijnagents-runner/plaud_wacht.py", "mijnagents-runner/dagbundelaar.py", "mijnagents-runner/agenda_wacht.py",
            "mijnagents-runner/fathom_wacht.py", "mijnagents-runner/koppelingen/**", "mijnagents/app.py", "docker-compose.yml",
            ".github/workflows/locatie-grendels.yml"]

jobs:
  # De tegel draait in python:3.11-slim (locatie/Dockerfile): dezelfde versie hier.
  dagindeling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r locatie/requirements.txt
      - run: python3 locatie/test_dagindeling.py
      - run: python3 locatie/test_atrack.py
      - run: LOCATIE_DB=/tmp/proef.db python3 locatie/test_atrack_server.py
      # bronbeleid: startgrens, toestel, dagranden van 23 en 25 uur, en de cronregels van
      # mijnagents-runner/planning/locatie.cron in zomer- en wintertijd
      - run: python3 locatie/test_bronbeleid.py
      - run: python3 locatie/test_schema.py
      - run: python3 locatie/test_herkenning.py
      - run: python3 locatie/test_auto.py
      - run: python3 locatie/test_export.py
      # opdracht v1.4: geen slot op de database tijdens traag netwerkwerk (trage geocoder, gelijktijdige schrijver)
      - run: python3 locatie/test_robuust.py

  # De wacht draait op de VM onder ~/agents/.venv (Python 3.12), niet in de container (3.11).
  # Tot 04-10-2026 stond dit in de job hierboven op 3.11, en struikelde de import van
  # agenda_wacht.py (een backslash in een f-string mag pas vanaf 3.12): de grendel was rood
  # zonder dat er aan de wacht iets mis was.
  wacht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r locatie/requirements.txt
      # de wacht zelf: projectplekken voor Nominatim, startgrens, geen vals alarm, revisies
      - run: python3 mijnagents-runner/tests/test_locatie_wacht.py
      # lezers van het locatielogboek buiten de wacht (controle 05-10-2026)
      - run: python3 mijnagents-runner/tests/test_levenscoach_grens.py
      # opdracht v1.4: Plaud, Archivaris, Dagbundelaar en het bord op de gestructureerde context, en de
      # inventaris die faalt zodra een nieuwe lezer van locatiegegevens geen grens heeft
      - run: python3 mijnagents-runner/tests/test_locatielezers.py
