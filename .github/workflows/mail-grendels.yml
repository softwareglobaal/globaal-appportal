# Grendels op de mailwachten en het maildashboard (skill mailregie). Driehoeksoverleg 19-10-2026 (3-0): een bron voor wat
# openstaat, beantwoord via de draad, gewone mail na een werkdag, eigen domein alleen uit bij een automatisch bericht,
# reclame naar Opgeruimd met een proefweek en een exacte domeinvergelijking. Tot dan draaiden test_postvak.py en
# test_sorteren.py in geen enkele workflow; test_mail.py draait ook in de Docker-build van het bord.
name: mail-grendels

on:
  push:
    paths: ["mijnagents-runner/koppelingen/postvak.py", "mijnagents-runner/mail_*.py", "mijnagents-runner/dagbundelaar.py", "mijnagents-runner/bode.py",
            "mijnagents-runner/mailregels/**", "mijnagents-runner/werkwijze/mailwachten.json", "mijnagents-runner/tests/test_postvak.py",
            "mijnagents/app.py", "mijnagents/templates/mail.html", "mijnagents/test_mail.py", "mijnagents/eenmalig_mail_een_bron.py",
            "post/imapbron.py", ".github/workflows/mail-grendels.yml"]
  pull_request:
    paths: ["mijnagents-runner/koppelingen/postvak.py", "mijnagents-runner/mail_*.py", "mijnagents-runner/dagbundelaar.py", "mijnagents-runner/bode.py",
            "mijnagents-runner/mailregels/**", "mijnagents-runner/werkwijze/mailwachten.json", "mijnagents-runner/tests/test_postvak.py",
            "mijnagents/app.py", "mijnagents/templates/mail.html", "mijnagents/test_mail.py", "mijnagents/eenmalig_mail_een_bron.py",
            "post/imapbron.py", ".github/workflows/mail-grendels.yml"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r mijnagents/requirements.txt
      - run: python3 mijnagents-runner/tests/test_postvak.py
      - run: python3 mijnagents-runner/mailregels/test_sorteren.py
      - run: cd mijnagents && python3 test_mail.py
      - run: cd post && python3 test_imapbron_herkans.py
