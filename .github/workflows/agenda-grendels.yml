# Grendels op De Agendawacht die zonder sleutels draaien: de codes van twee letters (Mehdi, 02-10-2026), het
# foutenregister, het leren in lagen, de wijzigingswacht (paginering, cursor, exitcode, oude dag, annulering) en de
# toezeggingen en voorstellen van de Regisseur (taak-ID, voorstel-ID, regelwijziging).
# De Felixwacht (03-10-2026): het werkgebied van FelixArchief en 'wie 85 zoekt, vindt 85-87'.
# 'Agendawacht - onderzoek en herstelvoorstel v1.1' p. 6-11: CI blokkeert de terugkeer van oude canonieke codes.
# Codex-controle ronde 2 (15-10-2026, FR-139 tot FR-157): gedragstests voor schrijfroutes, onvolledige bronnen, bellen en
# privacy in de logboeken; test_agenda_archief en het hermetische test_agenda_taken draaien sinds dan ook hier (A29, FR-157).
name: agenda-grendels

on:
  push:
    paths: ["mijnagents-runner/**"]
  pull_request:
    paths: ["mijnagents-runner/**"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 mijnagents-runner/tests/test_twee_letters.py
      - run: python3 mijnagents-runner/tests/test_foutenregister.py
      - run: python3 mijnagents-runner/tests/test_leren_in_lagen.py
      - run: python3 mijnagents-runner/tests/test_agenda_signaal.py
      - run: python3 mijnagents-runner/tests/test_agenda_beweging.py
      - run: python3 mijnagents-runner/tests/test_taken.py
      - run: python3 mijnagents-runner/tests/test_mail_afspraken.py
      - run: python3 mijnagents-runner/tests/test_zorg_afspraken.py
      - run: python3 mijnagents-runner/tests/test_agendagasten.py
      - run: python3 mijnagents-runner/tests/test_nacontrole_v12.py
      - run: python3 mijnagents-runner/tests/test_nacontrole_v13.py
      - run: python3 mijnagents-runner/tests/test_collegas_pdf.py
      - run: python3 mijnagents-runner/tests/test_agenda_archief.py
      - run: python3 mijnagents-runner/tests/test_codex_ronde2.py
      - run: python3 mijnagents-runner/tests/test_codex_ronde2_bode.py
      - run: python3 mijnagents-runner/tests/test_codex_ronde2_wachters.py
      - run: python3 mijnagents-runner/tests/test_codex_ronde3.py
      - run: python3 mijnagents-runner/tests/test_agenda_taken.py
