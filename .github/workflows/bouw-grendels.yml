name: bouw-grendels

# De afdeling Bouw (driehoeksoverleg 30-10-2026): De Aannemerszoeker en De Offertevergelijker. Geen stuk van de ene firma
# met een kenmerk van de andere, geen kandidaat zonder gelezen site of KBO, geen ontbrekende post als nul.
on:
  push:
    paths: ["mijnagents-runner/bouw/**", "mijnagents-runner/aannemerszoeker.py", "mijnagents-runner/offertevergelijker.py",
            "mijnagents-runner/werkwijze/aannemerszoeker.md", "mijnagents-runner/werkwijze/offertevergelijker.md",
            "mijnagents-runner/aankoop/**", "mijnagents-runner/tests/test_bouw.py", ".github/workflows/bouw-grendels.yml"]
  pull_request:
    paths: ["mijnagents-runner/bouw/**", "mijnagents-runner/aannemerszoeker.py", "mijnagents-runner/offertevergelijker.py",
            "mijnagents-runner/werkwijze/aannemerszoeker.md", "mijnagents-runner/werkwijze/offertevergelijker.md",
            "mijnagents-runner/aankoop/**", "mijnagents-runner/tests/test_bouw.py", ".github/workflows/bouw-grendels.yml"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python3 mijnagents-runner/tests/test_bouw.py
