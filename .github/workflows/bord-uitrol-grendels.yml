# Grendels op de borduitrol van mijnagents (16-10-2026, Codex CX7-1, CX8-1, CX9-1/2/3, CX10), los van de agents zodat
# ze altijd draaien: één uitrol tegelijk (flock), tijdslimieten, .built pas na een gezond bord op de nieuwe image,
# terugrol naar :vorige met nacontrole, tagfouten, herstel na een afgebroken ronde, en een mislukte revisie die wacht
# maar na de afkoeling of een vrijgave opnieuw kan. Met dash, util-linux flock en coreutils timeout, zoals op de VM.
name: bord-uitrol-grendels

on:
  push:
    paths: ["mijnagents/deploy.sh", "mijnagents/test_bord_deploy.py", ".github/workflows/bord-uitrol-grendels.yml"]
  pull_request:
    paths: ["mijnagents/deploy.sh", "mijnagents/test_bord_deploy.py", ".github/workflows/bord-uitrol-grendels.yml"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: echte dash, flock en timeout (geen vervangers uit de test)
        run: command -v dash flock timeout && readlink -f /bin/sh
      - run: shellcheck -s sh -S warning mijnagents/deploy.sh
      - run: python3 mijnagents/test_bord_deploy.py -v
