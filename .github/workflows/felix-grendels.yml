# Grendels op De Felixwacht (03-10-2026), los van de andere agents zodat ze altijd draaien:
# het werkgebied van FelixArchief (vijftien postcodes, zonder aantallen), 'wie 85 zoekt, vindt 85-87'
# (de fout van 02-10 bij August Van de Wielelei 85 in Deurne), het districtveld sluit niets uit, en de
# mapnamen houden inventarisnummer en busnummer leesbaar. Zonder net en zonder sleutels.
name: felix-grendels

on:
  push:
    paths: ["mijnagents-runner/felix_wacht.py", "mijnagents-runner/felix/**", "mijnagents-runner/koppelingen/felixarchief.py",
            "mijnagents-runner/koppelingen/adresregister.py", "mijnagents-runner/tests/test_felixwacht.py",
            ".github/workflows/felix-grendels.yml"]
  pull_request:
    paths: ["mijnagents-runner/felix_wacht.py", "mijnagents-runner/felix/**", "mijnagents-runner/koppelingen/felixarchief.py",
            "mijnagents-runner/koppelingen/adresregister.py", "mijnagents-runner/tests/test_felixwacht.py",
            ".github/workflows/felix-grendels.yml"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 mijnagents-runner/tests/test_felixwacht.py
