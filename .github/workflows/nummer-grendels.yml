# Grendels op de nummering (codering WP1 en WP2a, 05-10-2026; WP2b reservering 12-10-2026): dossiernummers komen uit hun bron via de
# gedeelde nummerlezer, H-A volgt de bevestigde regel (JJNN en (JJ+30)NN) voor elk jaar, en de
# Contracten-agent stelt geen nummer voor uit een onvolledige bron of een volle reeks.
name: nummer-grendels

on:
  push:
    paths: ["mijnagents-runner/koppelingen/nummerlezer.py", "mijnagents-runner/koppelingen/pipedrive.py",
            "mijnagents-runner/contracten_agent.py", "mijnagents-runner/goudstandaard.py",
            "mijnagents-runner/runbooks/pipedrive_dealtitel.py", "mijnagents-runner/benaming.py",
            "mijnagents-runner/fathom_wacht.py", "mijnagents-runner/agenda_wacht.py", "mijnagents-runner/archivaris.py",
            "mijnagents-runner/contactwacht.py", "mijnagents-runner/werkwijze/agenda-taken.json",
            "mijnagents-runner/tests/test_nummerlezer.py", "mijnagents-runner/tests/test_nummeruitgifte.py",
            "mijnagents-runner/tests/test_benaming.py", "mijnagents-runner/tests/test_nummerroutes.py",
            "mijnagents-runner/tests/test_dossierbewijs_zeker.py", "mijnagents-runner/plaud/dossier.py",
            "mijnagents-runner/koppelingen/bronnen.py", ".github/workflows/nummer-grendels.yml",
            "mijnagents-runner/mijnagents_uitvoerder.py", "mijnagents-runner/tests/test_nummerreservering.py",
            "mijnagents/app.py", "mijnagents/templates/board.html", "mijnagents/test_nummerreservering.py"]
  pull_request:
    paths: ["mijnagents-runner/koppelingen/nummerlezer.py", "mijnagents-runner/koppelingen/pipedrive.py",
            "mijnagents-runner/contracten_agent.py", "mijnagents-runner/benaming.py",
            "mijnagents-runner/tests/test_nummerlezer.py", "mijnagents-runner/tests/test_nummeruitgifte.py",
            "mijnagents-runner/tests/test_nummerroutes.py", "mijnagents-runner/koppelingen/bronnen.py",
            "mijnagents-runner/tests/test_dossierbewijs_zeker.py", "mijnagents-runner/plaud/dossier.py",
            "mijnagents-runner/fathom_wacht.py", "mijnagents-runner/archivaris.py",
            "mijnagents-runner/runbooks/pipedrive_dealtitel.py", "mijnagents-runner/tests/test_nummerreservering.py",
            "mijnagents/app.py", "mijnagents/test_nummerreservering.py"]

jobs:
  grendels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 mijnagents-runner/tests/test_nummerlezer.py
      # H1-2, driehoeksoverleg C2, 17-10-2026: bewijs op firma plus nummer.
      - run: python3 mijnagents-runner/tests/test_dossierbewijs_zeker.py
      - run: python3 mijnagents-runner/tests/test_nummeruitgifte.py
      # WP2b: reservering per voorstel (agent en runbook; bord met een tijdelijke databank)
      - run: python3 mijnagents-runner/tests/test_nummerreservering.py
      - run: python3 -m pip install -r mijnagents/requirements.txt
      - run: cd mijnagents && python3 test_nummerreservering.py
      - run: python3 -m pip install pytest==8.3.3
      - run: python3 -m pytest -q mijnagents-runner/tests/test_benaming.py mijnagents-runner/tests/test_nummerroutes.py
